      const menuBtn = document.getElementById('menuBtn');

      const settingsBtn = document.getElementById('settingsBtn');
      const headerSettingsBtn = document.getElementById('headerSettingsBtn');
      const settingsModal = document.getElementById('settingsModal');
      const closeModal = document.getElementById('closeModal');
      const saveSettingsBtn = document.getElementById('saveSettingsBtn');
      const themeSelect = document.getElementById('themeSelect');

      let currentTheme = localStorage.getItem('nep_ai_theme') || 'theme-crimson-red';
      document.body.className = currentTheme;
      themeSelect.value = currentTheme.replace('theme-', '');

      let isSidebarOpen = localStorage.getItem('nep_ai_sidebar') !== 'closed';
      if (window.innerWidth > 768 && !isSidebarOpen) sidebar.classList.add('collapsed');

      function toggleMenu() { 
        if (window.innerWidth > 768) {
          isSidebarOpen = !isSidebarOpen;
          localStorage.setItem('nep_ai_sidebar', isSidebarOpen ? 'open' : 'closed');
          sidebar.classList.toggle('collapsed', !isSidebarOpen);
        } else {
          sidebar.classList.toggle('open'); backdrop.classList.toggle('active'); 
        }
      }
      menuBtn.addEventListener('click', toggleMenu);
      backdrop.addEventListener('click', () => { sidebar.classList.remove('open'); backdrop.classList.remove('active'); });

      const openSettings = (e) => { if(e)e.preventDefault(); themeSelect.value = (localStorage.getItem('nep_ai_theme') || 'theme-crimson-red').replace('theme-', ''); settingsModal.classList.add('active'); };
      const closeSettings = (e) => { if(e)e.preventDefault(); settingsModal.classList.remove('active'); };
      settingsBtn.onclick = openSettings; headerSettingsBtn.onclick = openSettings; closeModal.onclick = closeSettings;
      settingsModal.onclick = (e) => { if (e.target === settingsModal) closeSettings(); };
      
      saveSettingsBtn.onclick = (e) => { 
        e.preventDefault(); 
        localStorage.setItem('nep_ai_theme', 'theme-' + themeSelect.value);
        settingsModal.classList.remove('active');
        window.location.reload();
      };

      let conversationHistory = [];
      let savedConversations = JSON.parse(localStorage.getItem('nep_ai_chat_history') || '[]');

      chatInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 90) + 'px';
      });

      attachBtn.addEventListener('click', () => imageInput.click());
      imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => { attachedBase64Image = ev.target.result; selectedThumb.src = attachedBase64Image; imagePreviewContainer.classList.add('active'); };
        reader.readAsDataURL(file);
      });
      removeImgBtn.addEventListener('click', () => { attachedBase64Image = null; imageInput.value = ''; imagePreviewContainer.classList.remove('active'); });

    <script>
      function speakText(buttonElement, text, onCompleteCallback = null) {
        if (!('speechSynthesis' in window)) { if (onCompleteCallback) onCompleteCallback(); return; }
        window.speechSynthesis.cancel();
        if (buttonElement && buttonElement.classList.contains('speaking')) { 
          buttonElement.classList.remove('speaking'); buttonElement.innerHTML = '🔊 Listen'; 
          if (onCompleteCallback) onCompleteCallback(); return; 
        }
        document.querySelectorAll('.tts-btn').forEach(btn => { btn.classList.remove('speaking'); btn.innerHTML = '🔊 Listen'; });
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';

        if (buttonElement) { buttonElement.classList.add('speaking'); buttonElement.innerHTML = '⏹ Stop'; }
        utterance.onend = () => { if (buttonElement) { buttonElement.classList.remove('speaking'); buttonElement.innerHTML = '🔊 Listen'; } if (onCompleteCallback) onCompleteCallback(); };
        utterance.onerror = () => { if (buttonElement) { buttonElement.classList.remove('speaking'); buttonElement.innerHTML = '🔊 Listen'; } if (onCompleteCallback) onCompleteCallback(); };
        window.speechSynthesis.speak(utterance);
      }

      function renderHistory() {
        if (savedConversations.length === 0) { historyList.innerHTML = `<div style="color: var(--text-muted); font-size: 0.8rem;">No recent chats</div>`; return; }
        historyList.innerHTML = '';
        savedConversations.forEach((chat, idx) => {
          const item = document.createElement('div');
          item.className = 'history-item';
          item.textContent = chat.title;
          item.addEventListener('click', () => { loadChat(idx); if (window.innerWidth <= 768) toggleMenu(); });
          historyList.appendChild(item);
        });
      }

      function loadChat(index) {
        stopVoiceMode(); window.speechSynthesis.cancel();
        if (currentAbortController) currentAbortController.abort();
        stopBtn.classList.remove('active');
        conversationHistory = [...savedConversations[index].messages];
        chatMessages.innerHTML = '';
        conversationHistory.forEach(msg => {
          let content = msg.content, img = null;
          if (Array.isArray(msg.content)) {
            content = msg.content.find(c => c.type === 'text')?.text || '';
            img = msg.content.find(c => c.type === 'image_url')?.image_url.url || null;
          }
          appendMessageUI(msg.role === 'user' ? 'user' : 'assistant', content, img);
        });
      }

      newChatBtn.addEventListener('click', () => {
        stopVoiceMode(); window.speechSynthesis.cancel();
        if (currentAbortController) currentAbortController.abort();
        stopBtn.classList.remove('active');
        if (conversationHistory.length > 0) saveCurrentChatToHistory();
        conversationHistory = [];
        chatMessages.innerHTML = `<div class="welcome-hero" id="welcomeHero"><h1>Hello! I am Nep AI</h1><p>How can I help you today?</p></div>`;
        if (window.innerWidth <= 768) toggleMenu();
      });

      function saveCurrentChatToHistory() {
        if (conversationHistory.length === 0) return;
        const first = conversationHistory.find(m => m.role === 'user');
        let title = "New Chat";
        if (first) {
          title = typeof first.content === 'string' ? first.content.slice(0, 30) + '...' : (first.content.find(c => c.type === 'text')?.text.slice(0, 30) + '...' || "Image Query");
        }
        savedConversations.unshift({ title, messages: [...conversationHistory] });
        if (savedConversations.length > 15) savedConversations.pop();
        localStorage.setItem('nep_ai_chat_history', JSON.stringify(savedConversations));
        renderHistory();
      }
    </script>
    <script>
      async function callGroqCloudAPI(promptText, imageUrl, isVoiceLoop = false) {
        const loadingId = 'msg-' + Date.now();
        chatMessages.innerHTML += `<div class="message-wrapper assistant" id="${loadingId}"><div class="message-bubble" style="opacity: 0.7;">Thinking...</div></div>`;
        chatMessages.scrollTop = chatMessages.scrollHeight;
        stopBtn.classList.add('active');
        currentAbortController = new AbortController();
        try {
          let userContent = imageUrl ? [{ type: "text", text: promptText || "Analyze this image" }, { type: "image_url", image_url: { url: imageUrl } }] : promptText;
          conversationHistory.push({ role: 'user', content: userContent });
          
          let systemInstruction = "You are Nep AI, a helpful, direct conversational assistant. Provide clear, concise answers suited for user inquiries without reasoning steps, markdown tables, or code blocks.";

          const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_API_KEY}` },
            body: JSON.stringify({ 
              model: 'qwen/qwen3.6-27b', 
              messages: [{ role: 'system', content: systemInstruction }, ...conversationHistory], 
              max_completion_tokens: 512, reasoning_format: 'hidden', reasoning_effort: 'none'
            }),
            signal: currentAbortController.signal
          });
          const data = await response.json();
          document.getElementById(loadingId)?.remove();
          stopBtn.classList.remove('active');
          
          if (data.choices && data.choices[0].message) {
            let aiReply = data.choices[0].message.content.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
            conversationHistory.push({ role: 'assistant', content: aiReply });
            appendMessageUI('assistant', aiReply);
            saveCurrentChatToHistory();

            if (isVoiceLoop && isVoiceModeActive) {
              const allAssistants = document.querySelectorAll('.message-wrapper.assistant');
              const ttsBtn = allAssistants[allAssistants.length - 1]?.querySelector('.tts-btn');
              speakText(ttsBtn, aiReply, () => { if (isVoiceModeActive) startVoiceRecognition(); });
            }
          } else {
            appendMessageUI('assistant', 'Error: Unexpected response from API.');
            if (isVoiceLoop && isVoiceModeActive) stopVoiceMode();
          }
        } catch (error) {
          document.getElementById(loadingId)?.remove();
          stopBtn.classList.remove('active');
          if (error.name === 'AbortError') {
            appendMessageUI('assistant', '_Generation stopped._');
            conversationHistory.push({ role: 'assistant', content: 'Generation stopped.' });
          } else {
            appendMessageUI('assistant', 'Network error connecting to API.');
          }
          if (isVoiceLoop && isVoiceModeActive) stopVoiceMode();
        }
      }

      stopBtn.addEventListener('click', () => { currentAbortController?.abort(); stopVoiceMode(); });

      function appendMessageUI(sender, text, imageUrl = null) {
        const welcomeHero = document.getElementById('welcomeHero');
        if (welcomeHero) welcomeHero.remove();
        let footerHtml = '', imageHtml = imageUrl ? `<img src="${imageUrl}" class="chat-img-preview" alt="Image" />` : '';
        let formattedContent = sender === 'user' ? `${imageHtml}<p>${(text || '').replace(/</g, "&lt;")}</p>` : marked.parse(text || '');
        if (sender !== 'user') {
          const tempDiv = document.createElement('div'); tempDiv.innerHTML = formattedContent;
          const encodedText = btoa(unescape(encodeURIComponent(tempDiv.textContent || tempDiv.innerText || '')));
          footerHtml = `<div class="msg-footer"><button class="tts-btn" onclick="speakEncodedText(this, '${encodedText}')">🔊 Listen</button></div>`;
        }
        chatMessages.innerHTML += `<div class="message-wrapper ${sender}"><div class="message-bubble">${formattedContent}</div>${footerHtml}</div>`;
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function speakEncodedText(btn, b64) { speakText(btn, decodeURIComponent(escape(atob(b64)))); }

      function handleSendMessage() {
        stopVoiceMode();
        const text = chatInput.value.trim(), activeImage = attachedBase64Image;
        if (!text && !activeImage) return;
        appendMessageUI('user', text || 'Sent an image', activeImage);
        chatInput.value = ''; chatInput.style.height = 'auto';
        attachedBase64Image = null; imageInput.value = ''; imagePreviewContainer.classList.remove('active');
        callGroqCloudAPI(text, activeImage, false);
      }

      sendBtn.addEventListener('click', handleSendMessage);
      chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMessage(); } });

      let isVoiceModeActive = false;
      let recognition = null;

      function setupSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return null;
        const rec = new SpeechRecognition();
        rec.continuous = false; rec.interimResults = false;
        rec.lang = 'en-US';

        rec.onresult = (event) => {
          const spokenText = event.results[0][0].transcript.trim();
          if (spokenText && isVoiceModeActive) {
            appendMessageUI('user', spokenText);
            callGroqCloudAPI(spokenText, null, true);
          }
        };
        rec.onerror = (event) => {
          if (isVoiceModeActive && event.error !== 'aborted') {
            setTimeout(() => { if (isVoiceModeActive) startVoiceRecognition(); }, 1000);
          }
        };
        return rec;
      }

      function startVoiceRecognition() {
        if (!isVoiceModeActive) return;
        try {
          if (!recognition) recognition = setupSpeechRecognition();
          if (recognition) { recognition.start(); voiceModeBtn.classList.add('listening'); }
          else { alert("Speech recognition not supported."); stopVoiceMode(); }
        } catch (err) {}
      }

      function stopVoiceMode() {
        isVoiceModeActive = false;
        voiceModeBtn.classList.remove('listening');
        if (recognition) { try { recognition.stop(); } catch(e) {} }
      }

      voiceModeBtn.addEventListener('click', () => {
        if (isVoiceModeActive) { stopVoiceMode(); } 
        else { window.speechSynthesis.cancel(); isVoiceModeActive = true; startVoiceRecognition(); }
      });

      renderHistory();
    </script>
    renderHistory();
    </script>
  </body>
</html>
