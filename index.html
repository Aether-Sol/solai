<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sol AI - Aesthetic Experience</title>

        --gradient-end: #c084fc;
        --msg-user: linear-gradient(135deg, #7e22ce, #6b21a8);
        --user-shadow: rgba(126, 34, 206, 0.3);
      }

        --user-shadow: rgba(14, 116, 144, 0.3);
      }
      body.theme-violet {
        --bg-deep: #0a0614;

        --bg-hover: #23193b;

        --primary: #a78bfa;
        --glow: rgba(167, 139, 250, 0.35);
        --text-main: #f5f3ff;
        --text-muted: #c4b5fd;

      }
      body.theme-lime {
        --bg-deep: #0b1206;
        --bg-surface: #15240c;
        --bg-hover: #243b15;
        --border-color: rgba(163, 230, 53, 0.15);
        --primary: #a3e635;
        --glow: rgba(163, 230, 53, 0.35);
        --text-main: #f7fee7;
        --text-muted: #bef264;
        --gradient-start: #bef264;

      }
      body.theme-orange {
        --bg-deep: #140b06;
        --bg-surface: #24160d;
        --bg-hover: #3b2516;
        --border-color: rgba(251, 146, 60, 0.15);
        --primary: #fb923c;
        --glow: rgba(251, 146, 60, 0.35);
        --text-main: #fff7ed;
        --text-muted: #fed7aa;
        --gradient-start: #fed7aa;

        --msg-user: linear-gradient(135deg, #c2410c, #9a3412);
        --user-shadow: rgba(194, 65, 12, 0.3);
      }
      body.theme-teal {
        --bg-deep: #041212;
        --bg-surface: #0a2020;
        --bg-hover: #133636;
        --border-color: rgba(45, 212, 191, 0.15);
        --primary: #22ddbf;
        --glow: rgba(45, 212, 191, 0.35);
        --text-main: #f0fdfa;
        --text-muted: #99f6e4;
        --gradient-start: #99f6e4;
        --gradient-end: #0d9488;
        --msg-user: linear-gradient(135deg, #0f766e, #115e59);
        --user-shadow: rgba(15, 118, 110, 0.3);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
      }

      body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        height: 100vh;
        display: flex;
        overflow: hidden;
        position: relative;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      body::before {
        content: "";
        position: absolute;
        top: -20%;
        left: -10%;
        width: 50vw;
        height: 50vh;
        background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
        z-index: 0;
        pointer-events: none;
        transition: background 0.3s ease;
      }

      .particle {
        position: absolute;
        background: linear-gradient(
          135deg,
          var(--gradient-start),
          var(--gradient-end)
        );
        opacity: 0.5;
        border-radius: 150% 0 150% 0;
        animation: fall linear infinite;
        z-index: 1;
        pointer-events: none;
        box-shadow: 0 0 8px var(--glow);
      }

      @keyframes fall {
        0% {
          transform: translateY(-10vh) rotate(0deg) scale(0.8);
          opacity: 0.7;
        }
        50% {
          opacity: 0.4;
        }
        100% {
          transform: translateY(110vh) rotate(360deg) scale(1.2);
          opacity: 0;
        }
      }

      .sidebar {
        width: 280px;
        background-color: var(--bg-surface);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        z-index: 10;
        backdrop-filter: blur(12px);
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4);
        position: relative;
        transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.3s ease-in-out;
      }

      .sidebar-top {
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo-area {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        font-size: 1.6rem;
        background: linear-gradient(135deg, var(--text-main), var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        cursor: pointer;
        position: relative;
      }

      .online-dot {
        width: 10px;
        height: 10px;
        background-color: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 10px #22c55e;
        display: inline-block;
        -webkit-text-fill-color: initial;
      }

      .sidebar-actions {
        padding: 0 16px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .btn-action {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 11px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 0.9rem;
        text-align: left;
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }

      .btn-action:hover {
        background: var(--bg-hover);
        border-color: var(--primary);
      }

      .btn-new-chat {
        background: linear-gradient(
          135deg,
          var(--gradient-start),
          var(--gradient-end)
        );
        color: #fff;
        border: none;
        font-weight: 600;
        box-shadow: 0 4px 12px var(--glow);
      }

      .btn-new-chat:hover {
        opacity: 0.95;
        transform: translateY(-1px);
        box-shadow: 0 6px 16px var(--glow);
      }

      .recent-chats-container {
        flex: 1;
        overflow-y: auto;
        padding: 0 16px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .recent-chats-container.collapsed {
        display: none;
      }

      .section-title {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
        margin-bottom: 8px;
        margin-top: 10px;
      }

      .chat-history-item {
        background: transparent;
        border: none;
        color: var(--text-muted);
        padding: 10px 12px;
        border-radius: 8px;
        text-align: left;
        cursor: pointer;
        font-size: 0.9rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: all 0.2s ease;
        width: 100%;
      }

      .chat-history-item:hover {
        background: var(--bg-hover);
        color: var(--text-main);
        transform: translateX(2px);
      }

      .chat-history-item.active {
        background: var(--bg-hover);
        border-left: 3px solid var(--primary);
        color: var(--text-main);
      }

      .empty-history {
        font-size: 0.85rem;
        color: var(--text-muted);
        opacity: 0.7;
        padding: 8px 10px;
        font-style: italic;
      }

      .sidebar-footer {
        padding: 14px 16px;
        font-size: 0.75rem;
        color: var(--text-muted);
        border-top: 1px solid var(--border-color);
        background: rgba(0, 0, 0, 0.2);
      }

      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100vh;
        z-index: 10;
        position: relative;
        width: calc(100% - 280px);
      }

      .chat-header {
        padding: 18px 28px;
        border-bottom: 1px solid var(--border-color);
        background: var(--bg-surface);
        backdrop-filter: blur(12px);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        transition: background-color 0.3s ease, border-color 0.3s ease;
        gap: 14px;
      }

      /* MOBILE MENU TOGGLE BUTTON (Hidden on Desktop) */
      .mobile-menu-toggle {
        display: none;
        background: var(--bg-deep);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        font-size: 1.2rem;
        padding: 8px 12px;
        border-radius: 10px;
        cursor: pointer;
      }

      /* MODEL SELECTOR LAYOUT */
      .model-selector-wrapper {
        position: relative;
      }

      .model-select-btn {
        background: var(--bg-deep);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 10px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }

      .model-select-btn:hover {
        border-color: var(--primary);
        background: var(--bg-hover);
        box-shadow: 0 4px 12px var(--glow);
      }

      .model-dropdown-menu {
        position: absolute;
        top: 54px;
        right: 0;
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        width: 270px;
        box-shadow: 0 14px 35px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        padding: 10px;
        z-index: 500;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-10px) scale(0.98);
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .model-dropdown-menu.active {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0) scale(1);
      }

      .model-option-item {
        background: transparent;
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 12px;
        text-align: left;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 4px;
        transition: all 0.2s ease;
      }

      .model-option-item:hover:not(.disabled) {
        background: var(--bg-hover);
        border-color: var(--border-color);
      }

      .model-option-item.disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .model-option-title {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .model-option-desc {
        font-size: 0.78rem;
        color: var(--text-muted);
        line-height: 1.4;
      }

      .btn-gear {
        background: transparent;
        border: 1px solid var(--border-color);
        font-size: 1.35rem;
        cursor: pointer;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.8),
          0 0 16px rgba(255, 255, 255, 0.4);
        transition: all 0.25s ease;
      }

      .btn-gear:hover {
        background: var(--bg-hover);
        border-color: #ffffff;
        transform: rotate(45deg);
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
      }

      .user-menu-container {
        position: relative;
      }

      .user-avatar-badge {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          var(--gradient-start),
          var(--gradient-end)
        );
        color: #fff;
        font-weight: 700;
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 0 12px var(--glow);
        transition: transform 0.2s ease, opacity 0.2s ease;
        text-transform: uppercase;
      }

      .user-avatar-badge:hover {
        transform: scale(1.08);
        opacity: 0.9;
      }

      .user-dropdown-menu {
        position: absolute;
        top: 52px;
        right: 0;
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        width: 180px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        padding: 6px;
        z-index: 500;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-8px);
        transition: all 0.2s ease;
      }

      .user-dropdown-menu.active {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .dropdown-item {
        background: transparent;
        border: none;
        color: var(--text-main);
        padding: 10px 12px;
        border-radius: 8px;
        text-align: left;
        cursor: pointer;
        font-size: 0.9rem;
        transition: background 0.2s;
      }

      .dropdown-item:hover {
        background: var(--bg-hover);
      }

      .dropdown-item.logout {
        color: #ef4444;
        font-weight: 600;
      }
      .dropdown-item.logout:hover {
        background: rgba(239, 68, 68, 0.1);
      }

      .auth-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(9, 6, 16, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }

      .auth-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .auth-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        width: 400px;
        max-width: 90%;
        border-radius: 20px;
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        animation: scaleUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes scaleUp {
        from {
          transform: scale(0.9);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .auth-title {
        font-size: 1.6rem;
        font-weight: 700;
        text-align: center;
        background: linear-gradient(135deg, var(--text-main), var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .auth-error {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fca5a5;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        text-align: center;
        display: none;
      }

      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .auth-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .auth-label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .auth-input {
        background: var(--bg-deep);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 12px 14px;
        color: var(--text-main);
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .auth
