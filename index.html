<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            height: 100vh;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Flower / Petal Rain Canvas */
        #flower-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background-color: #1e1f20;
            display: flex;
            flex-direction: column;
            padding: 16px;
            border-right: 1px solid #2f3033;
            z-index: 2;
        }

        .sidebar-brand {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f1f3f4;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-brand span {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .new-chat-btn {
            background: #282a2c;
            border: 1px solid #3c4043;
            color: #e3e3e3;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            text-align: left;
            transition: background 0.2s;
            margin-bottom: 20px;
        }

        .new-chat-btn:hover {
            background: #333538;
        }

        .history-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #8e918f;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #c4c7c5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s;
        }

        .history-item:hover {
            background: #282a2c;
            color: #f1f3f4;
        }

        .history-item.active {
            background: #2b2c2f;
            color: #ff7eb3;
        }

        /* Main Chat Area */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        .chat-header {
            padding: 16px 24px;
            font-size: 1.25rem;
            font-weight: 600;
            border-bottom: 1px solid #2f3033;
            background: rgba(19, 19, 20, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header span {
            color: #ff7eb3;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
            position: relative;
        }

        /* Welcome Screen */
        .welcome-screen {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
            transition: opacity 0.3s ease;
        }

        .welcome-screen h1 {
            font-size: 2.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .welcome-screen p {
            color: #8e918f;
            font-size: 1.1rem;
        }

        .message {
            max-width: 750px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            gap: 16px;
            animation: fadeIn 0.3s ease-in-out;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.user .bubble {
            background-color: #2b2c2f;
            color: #f1f3f4;
            padding: 12px 18px;
            border-radius: 18px 18px 4px 18px;
        }

        .message.ai .bubble {
            background-color: transparent;
            color: #e3e3e3;
            padding: 4px 0;
            width: 100%;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background-color: #555;
            order: 2;
        }

        .message.ai .avatar {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
        }

        /* Input Area */
        .input-container {
            padding: 20px 24px 30px;
            background: linear-gradient(transparent, #131314 40%);
            display: flex;
            justify-content: center;
        }

        .input-box {
            max-width: 750px;
            width: 100%;
            background-color: #1e1f20;
            border: 1px solid #3c4043;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 8px 12px 8px 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: border-color 0.2s;
        }

        .input-box:focus-within {
            border-color: #ff7eb3;
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #e3e3e3;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            max-height: 150px;
            padding-top: 6px;
        }

        .send-btn {
            background: #ff7eb3;
            border: none;
            color: #131314;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s, transform 0.1s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            float: left;
            margin: 0 2px;
            background-color: #999;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.3s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) { animation-delay: -1.1s; }
        .typing-indicator span:nth-child(3) { animation-delay: -0.9s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <!-- Falling Flowers Canvas -->
    <canvas id="flower-canvas"></canvas>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            🌸 <span>Sol AI</span>
        </div>
        <button class="new-chat-btn" onclick="startNewChat()">+ New chat</button>
        <div class="history-title">Recent Chats</div>
        <div class="history-list" id="historyList">
            <!-- Dynamically loaded chat history sessions -->
        </div>
    </div>

    <!-- Main Chat Content -->
    <div class="main-container">
        <div class="chat-header">
            Sol <span>AI</span>
        </div>

        <div class="chat-history" id="chatHistory">
            <div class="welcome-screen" id="welcomeScreen">
                <h1>Ask whatever in your mind</h1>
                <p>Explore ideas, write code, or create with Sol AI</p>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" rows="1" placeholder="Message Sol AI..." onkeydown="handleKey(event)"></textarea>
                <button class="send-btn" onclick="askAI()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Flower Petal Rain Animation
        const canvas = document.getElementById('flower-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Petal {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = Math.random() * 8 + 6;
                this.speedY = Math.random() * 1.2 + 0.6;
                this.speedX = Math.random() * 1 - 0.5;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 2 - 1;
                this.color = Math.random() > 0.5 ? '#ffb6c1' : '#ff7eb3';
                this.opacity = Math.random() * 0.5 + 0.3;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y / 30) * 0.5;
                this.rotation += this.rotationSpeed;
                if (this.y > canvas.height + 20) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const petalsArray = Array.from({ length: 25 }, () => new Petal());
        function animatePetals() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petalsArray.forEach(petal => {
                petal.update();
                petal.draw();
            });
            requestAnimationFrame(animatePetals);
        }
        animatePetals();

        // Multi-Session Chat State & LocalStorage Management
        let chats = JSON.parse(localStorage.getItem('sol_ai_chats')) || [];
        let currentChatId = null;

        function saveChats() {
            localStorage.setItem('sol_ai_chats', JSON.stringify(chats));
        }

        function renderHistoryList() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.innerText = chat.title;
                item.onclick = () => loadChat(chat.id);
                historyList.appendChild(item);
            });
        }

        function startNewChat() {
            currentChatId = null;
            document.getElementById('chatHistory').innerHTML = `
                <div class="welcome-screen" id="welcomeScreen">
                    <h1>Ask whatever in your mind</h1>
                    <p>Explore ideas, write code, or create with Sol AI</p>
                </div>
            `;
            renderHistoryList();
        }

        function loadChat(id) {
            currentChatId = id;
            const chat = chats.find(c => c.id === id);
            const chatHistory = document.getElementById('chatHistory');
            
            if (!chat) return;

            let html = '';
            chat.messages.forEach(msg => {
                if (msg.role === 'user') {
                    html += `
                        <div class="message user">
                            <div class="avatar">U</div>
                            <div class="bubble">${escapeHTML(msg.content)}</div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="message ai">
                            <div class="avatar">S</div>
                            <div class="bubble">${formatAIResponse(msg.content)}</div>
                        </div>
                    `;
                }
            });
            chatHistory.innerHTML = html;
            chatHistory.scrollTop = chatHistory.scrollHeight;
            renderHistoryList();
        }

        async function askAI() {
            const inputField = document.getElementById('userInput');
            const prompt = inputField.value.trim();
            if (!prompt) return;

            const chatHistory = document.getElementById('chatHistory');
            const welcomeScreen = document.getElementById('welcomeScreen');

            if (welcomeScreen) {
                welcomeScreen.style.opacity = '0';
                setTimeout(() => welcomeScreen.remove(), 300);
            }

            // If no active chat session, create a new one
            if (!currentChatId) {
                currentChatId = 'chat_' + Date.now();
                chats.unshift({
                    id: currentChatId,
                    title: prompt.length > 25 ? prompt.substring(0, 25) + '...' : prompt,
                    messages: []
                });
            }

            // Append User Message to UI & active chat object
            chatHistory.innerHTML += `
                <div class="message user">
                    <div class="avatar">U</div>
                    <div class="bubble">${escapeHTML(prompt)}</div>
                </div>
            `;
            
            const activeChat = chats.find(c => c.id === currentChatId);
            activeChat.messages.push({ role: 'user', content: prompt });
            saveChats();
            renderHistoryList();

            inputField.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            // Append Loading Bubble
            const loadingId = 'loading-' + Date.now();
            chatHistory.innerHTML += `
                <div class="message ai" id="${loadingId}">
                    <div class="avatar">S</div>
                    <div class="bubble">
                        <div class="typing-indicator">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            `;
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                const response = await fetch(window.location.origin + '/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();
                const replyText = data.reply || "No response received.";
                
                const aiBubble = document.querySelector(`#${loadingId} .bubble`);
                aiBubble.innerHTML = formatAIResponse(replyText);

                // Save AI response to session storage
                activeChat.messages.push({ role: 'ai', content: replyText });
                saveChats();
            } catch (err) {
                const aiBubble = document.querySelector(`#${loadingId} .bubble`);
                aiBubble.innerText = "Error connecting to Sol AI backend.";
            }
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function handleKey(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                askAI();
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function formatAIResponse(text) {
            return escapeHTML(text).replace(/\n/g, '<br>');
        }

        // Initialize sidebar on page load
        renderHistoryList();
    </script>
</body>
</html>
