<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sol AI - Aesthetic Experience</title>
    <style>
      :root {
        --bg-deep: #090610;
        --bg-surface: #130d20;
        --bg-hover: #1f1435;
        --border-color: rgba(192, 132, 252, 0.15);
        --primary: #c084fc;
        --glow: rgba(192, 132, 252, 0.35);
        --text-main: #f3e8ff;
        --text-muted: #a78bfa;
        --gradient-start: #e879f9;
        --gradient-end: #c084fc;
        --msg-user: linear-gradient(135deg, #7e22ce, #6b21a8);
        --user-shadow: rgba(126, 34, 206, 0.3);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        height: 100vh;
        display: flex;
        overflow: hidden;
        position: relative;
      }

      .sidebar {
        width: 280px;
        background-color: var(--bg-surface);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        z-index: 10;
        backdrop-filter: blur(12px);
        position: relative;
        transition: transform 0.3s ease-in-out;
      }

      .sidebar-top {
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo-area {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        font-size: 1.6rem;
        background: linear-gradient(135deg, var(--text-main), var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .online-dot {
        width: 10px;
        height: 10px;
        background-color: #22c55e;
        border-radius: 50%;
        display: inline-block;
        -webkit-text-fill-color: initial;
      }

      .sidebar-actions {
        padding: 0 16px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .btn-action {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 11px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 0.9rem;
        text-align: left;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }

      .btn-new-chat {
        background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
        color: #fff;
        border: none;
        font-weight: 600;
      }

      .recent-chats-container {
        flex: 1;
        overflow-y: auto;
        padding: 0 16px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .section-title {
        font-size: 0.75rem;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 8px;
        margin-top: 10px;
      }

      .empty-history {
        font-size: 0.85rem;
        color: var(--text-muted);
        opacity: 0.7;
        padding: 8px 10px;
      }

      .sidebar-footer {
        padding: 14px 16px;
        font-size: 0.75rem;
        color: var(--text-muted);
        border-top: 1px solid var(--border-color);
      }

      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100vh;
        z-index: 10;
        position: relative;
        width: calc(100% - 280px);
      }

      .chat-header {
        padding: 18px 28px;
        border-bottom: 1px solid var(--border-color);
        background: var(--bg-surface);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 14px;
      }

      .mobile-menu-toggle {
        display: none;
        background: var(--bg-deep);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        font-size: 1.2rem;
        padding: 8px 12px;
        border-radius: 10px;
        cursor: pointer;
      }

      .model-selector-wrapper {
        position: relative;
      }

      .model-select-btn {
        background: var(--bg-deep);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 10px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .model-dropdown-menu {
        position: absolute;
        top: 54px;
        right: 0;
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        width: 270px;
        display: none;
        flex-direction: column;
        padding: 10px;
        z-index: 500;
      }

      .model-dropdown-menu.active {
        display: flex;
      }

      .model-option-item {
        background: transparent;
        border-radius: 10px;
        padding: 12px;
        cursor: pointer;
      }

      .model-option-title {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text-main);
      }

      .model-option-desc {
        font-size: 0.78rem;
        color: var(--text-muted);
      }

      .btn-gear {
        background: transparent;
        border: 1px solid var(--border-color);
        font-size: 1.35rem;
        cursor: pointer;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
      }

      .user-menu-container {
        position: relative;
      }

      .user-avatar-badge {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
        color: #fff;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .user-dropdown-menu {
        position: absolute;
        top: 52px;
        right: 0;
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        width: 180px;
        display: none;
        flex-direction: column;
        padding: 6px;
        z-index: 500;
      }

      .user-dropdown-menu.active {
        display: flex;
      }

      .dropdown-item {
        background: transparent;
        border: none;
        color: var(--text-main);
        padding: 10px 12px;
        border-radius: 8px;
        text-align: left;
        cursor: pointer;
      }

      .dropdown-item.logout {
        color: #ef4444;
        font-weight: 600;
      }

      /* AUTH OVERLAY FIXED TO DISPLAY CORRECTLY */
      .auth-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(9, 6, 16, 0.85);
        backdrop-filter: blur(16px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
      }

      .auth-overlay.hidden {
        display: none;
      }

      .auth-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        width: 400px;
        max-width: 90%;
        border-radius: 20px;
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }

      .auth-title {
        font-size: 1.6rem;
        font-weight: 700;
        text-align: center;
        background: linear-gradient(135deg, var(--text-main), var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .auth-error {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fca5a5;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        text-align: center;
        display: none;
      }

      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .auth-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .auth-label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
      }

      .auth-input {
        background: var(--bg-deep);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 12px 14px;
        color: var(--text-main);
        font-size: 0.95rem;
        outline: none;
      }

      .auth-btn {
        background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
      }

      .auth-switch {
        text-align: center;
        font-size: 0.85rem;
        color: var(--text-muted);
        cursor: pointer;
      }

      .auth-switch span {
        color: var(--primary);
        font-weight: 600;
      }

      .chat-messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .message-wrapper {
        display: flex;
        gap: 14px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .message-wrapper.user {
        justify-content: flex-end;
      }

      .message-bubble {
        padding: 14px 18px;
        border-radius: 16px;
        font-size: 0.95rem;
        line-height: 1.5;
        word-break: break-word;
      }

      .message-wrapper.user .message-bubble {
        background: var(--msg-user);
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .message-wrapper.assistant .message-bubble {
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        border-bottom-left-radius: 4px;
      }

      .chat-input-area {
        padding: 20px 28px;
        background: var(--bg-surface);
        border-top: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        gap: 14px;
        max-width: 900px;
        width: 100%;
        margin: 0 auto 20px auto;
        border-radius: 16px;
      }

      .chat-input {
        flex: 1;
        background: var(--bg-deep);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 14px 18px;
        color: var(--text-main);
        font-size: 0.95rem;
        outline: none;
        resize: none;
      }

      .send-btn {
        background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
        border: none;
        color: #fff;
        width: 46px;
        height: 46px;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .sidebar-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.5);
        z-index: 9;
        display: none;
      }

      .sidebar-backdrop.active {
        display: block;
      }

      @media (max-width: 768px) {
        .mobile-menu-toggle {
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .sidebar {
          position: fixed;
          top: 0;
          left: 0;
          height: 100vh;
          transform: translateX(-100%);
          width: 280px;
          z-index: 100;
        }

        .sidebar.open {
          transform: translateX(0);
        }

        .main-content {
          width: 100vw;
        }

        .chat-header {
          padding: 12px 16px;
          justify-content: space-between;
        }

        .chat-input-area {
          margin: 0 10px 10px 10px;
          width: calc(100% - 20px);
          padding: 12px;
        }
      }
    </style>
  </head>
  <body class="theme-purple">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="logo-area" id="logoHome">
          Sol Ai <span class="online-dot"></span>
        </div>
      </div>
      <div class="sidebar-actions">
        <button class="btn-action btn-new-chat" id="newChatBtn">
          + New chat
        </button>
      </div>
      <div class="recent-chats-container" id="recentChatsContainer">
        <div class="section-title">History</div>
        <div class="empty-history" id="emptyHistoryText">No recent chats</div>
      </div>
      <div class="sidebar-footer">
        Copyright Aayush Dc
      </div>
    </aside>

    <main class="main-content">
      <header class="chat-header">
        <button class="mobile-menu-toggle" id="mobileMenuBtn" aria-label="Toggle Menu">
          &#9776;
        </button>
        <div class="model-selector-wrapper">
          <button class="model-select-btn" id="modelSelectBtn">
            <span id="currentModelName">Sol Free</span>
            <span>▼</span>
          </button>
          <div class="model-dropdown-menu" id="modelDropdown">
            <div class="model-option-item" data-model="Sol Free">
              <div class="model-option-title">Sol Free</div>
              <div class="model-option-desc">Fast, standard free conversational tier.</div>
            </div>
          </div>
        </div>
        <button class="btn-gear" id="settingsBtn" title="Settings">⚙</button>
        <div class="user-menu-container">
          <div class="user-avatar-badge" id="userAvatarBadge">A</div>
          <div class="user-dropdown-menu" id="userDropdown">
            <button class="dropdown-item logout" id="logoutBtn">Logout</button>
          </div>
        </div>
      </header>

      <div class="chat-messages-container" id="chatMessages">
        <div class="message-wrapper assistant">
          <div class="message-bubble">Hello! How can I help you today?</div>
        </div>
      </div>

      <div class="chat-input-area">
        <textarea class="chat-input" id="chatInput" placeholder="Message Sol Ai..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </main>

    <!-- WORKING LOGIN / AUTH OVERLAY -->
    <div class="auth-overlay" id="authOverlay">
      <div class="auth-card">
        <div class="auth-title" id="authTitle">Welcome to Sol Ai</div>
        <div class="auth-error" id="authError"></div>
        <form class="auth-form" id="authForm">
          <div class="auth-field">
            <label class="auth-label">Username / Email</label>
            <input type="text" class="auth-input" id="authEmail" required />
          </div>
          <div class="auth-field">
            <label class="auth-label">Password</label>
            <input type="password" class="auth-input" id="authPassword" required />
          </div>
          <button type="submit" class="auth-btn" id="authSubmitBtn">Continue</button>
        </form>
        <div class="auth-switch" id="authSwitchText">
          Already have an account? <span>Sign In</span>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const menuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebarBackdrop');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');
        
        // Auth elements
        const authOverlay = document.getElementById('authOverlay');
        const authForm = document.getElementById('authForm');
        const logoutBtn = document.getElementById('logoutBtn');
        const userAvatarBadge = document.getElementById('userAvatarBadge');
        const userDropdown = document.getElementById('userDropdown');

        // Toggle mobile drawer
        function toggleMobileMenu() {
          sidebar.classList.toggle('open');
          backdrop.classList.toggle('active');
        }

        if (menuBtn && sidebar && backdrop) {
          menuBtn.addEventListener('click', toggleMobileMenu);
          backdrop.addEventListener('click', toggleMobileMenu);
        }

        // Functional Login / Form submit (dismisses the overlay)
        if (authForm) {
          authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            authOverlay.classList.add('hidden');
          });
        }

        // User dropdown toggle
        if (userAvatarBadge && userDropdown) {
          userAvatarBadge.addEventListener('click', (e) => {
            e.stopPropagation();
            userDropdown.classList.toggle('active');
          });
          document.addEventListener('click', () => {
            userDropdown.classList.remove('active');
          });
        }

        // Logout brings back login screen
        if (logoutBtn) {
          logoutBtn.addEventListener('click', () => {
            authOverlay.classList.remove('hidden');
            userDropdown.classList.remove('active');
          });
        }

        // Chat auto-resize and messaging
        if (chatInput) {
          chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
          });
        }

        function handleSendMessage() {
          const text = chatInput.value.trim();
          if (!text) return;

          chatMessages.innerHTML += `
            <div class="message-wrapper user">
              <div class="message-bubble">${text}</div>
            </div>
          `;
          chatInput.value = '';
          chatInput.style.height = 'auto';
          chatMessages.scrollTop = chatMessages.scrollHeight;

          setTimeout(() => {
            chatMessages.innerHTML += `
              <div class="message-wrapper assistant">
                <div class="message-bubble">I am running locally! How else can I assist you?</div>
              </div>
            `;
            chatMessages.scrollTop = chatMessages.scrollHeight;
          }, 600);
        }

        if (sendBtn) sendBtn.addEventListener('click', handleSendMessage);
        if (chatInput) {
          chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              handleSendMessage();
            }
          });
        }
      });
    </script>
  </body>
  </html>
