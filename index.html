<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nep AI - Advanced Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-color: #1e293b;
            --chat-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #334155;
            --user-bubble: #6366f1;
            --ai-bubble: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .new-chat-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: var(--accent-hover);
        }

        .chat-history {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s, color 0.2s;
        }

        .history-item:hover, .history-item.active {
            background-color: var(--border-color);
            color: var(--text-color);
        }

        /* Main Container */
        .main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
            font-size: 18px;
            font-weight: 600;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .message.ai {
            margin-right: auto;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
            word-break: break-word;
        }

        .message.user .message-content {
            background-color: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.ai .message-content {
            background-color: var(--ai-bubble);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
        }

        /* Image Display & Direct Download */
        .ai-image-container {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 400px;
        }

        .ai-image-container img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .download-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: fit-content;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background-color: #059669;
        }

        /* Input Area */
        .chat-input-area {
            padding: 20px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex-grow: 1;
            background-color: var(--sidebar-color);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 15px;
            resize: none;
            outline: none;
            max-height: 150px;
        }

        .chat-input:focus {
            border-color: var(--accent-color);
        }

        .send-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Nep AI</h2>
            <button class="new-chat-btn" id="newChatBtn">
                <span>+</span> New Chat
            </button>
        </div>
        <div class="chat-history" id="chatHistory">
            <!-- Dynamic History Items -->
        </div>
        <div style="font-size: 12px; color: var(--text-muted); text-align: center;">
            Nep AI v3.0 Pro
        </div>
    </div>

    <!-- Main Chat Section -->
    <div class="main-container">
        <div class="chat-header" id="chatTitle">New Conversation</div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <div class="message-content">Hello! I am Nep AI. How can I help you today? You can ask me questions or instruct me to generate realistic images (e.g., "generate a realistic photo of a mountain").</div>
            </div>
        </div>

        <div class="chat-input-area">
            <textarea class="chat-input" id="userInput" placeholder="Type a message or request an image..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>
    <script>
        let chats = [];
        let currentChatId = null;

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        const chatHistoryEl = document.getElementById('chatHistory');
        const chatTitle = document.getElementById('chatTitle');

        // Initialize chat session
        function initNewChat() {
            currentChatId = 'chat_' + Date.now();
            chats.unshift({
                id: currentChatId,
                title: 'New Conversation',
                messages: [{ role: 'ai', content: 'Hello! I am Nep AI. How can I help you today? You can ask me questions or instruct me to generate realistic images.' }]
            });
            renderHistory();
            renderMessages();
            chatTitle.textContent = 'New Conversation';
        }

        function renderHistory() {
            chatHistoryEl.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.textContent = chat.title;
                item.onclick = () => switchChat(chat.id);
                chatHistoryEl.appendChild(item);
            });
        }

        function switchChat(id) {
            currentChatId = id;
            const activeChat = chats.find(c => c.id === id);
            if (activeChat) {
                chatTitle.textContent = activeChat.title;
                renderMessages();
                renderHistory();
            }
        }

        function renderMessages() {
            chatMessages.innerHTML = '';
            const activeChat = chats.find(c => c.id === currentChatId);
            if (!activeChat) return;

            activeChat.messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${msg.role}`;
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';

                if (msg.type === 'image') {
                    contentDiv.innerHTML = `
                        <div>${msg.text}</div>
                        <div class="ai-image-container">
                            <img src="${msg.imageUrl}" alt="Generated AI Image" crossorigin="anonymous">
                            <button class="download-btn" onclick="downloadImage('${msg.imageUrl}')">
                                ⬇ Download Image
                            </button>
                        </div>
                    `;
                } else {
                    contentDiv.textContent = msg.content;
                }

                msgDiv.appendChild(contentDiv);
                chatMessages.appendChild(msgDiv);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Direct image downloader bypassing redirect
        async function downloadImage(url) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `nep-ai-${Date.now()}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                console.error('Download failed, fallback to direct open:', error);
                window.open(url, '_blank');
            }
        }

        // Image generation prompt detection check
        function isImageRequest(text) {
            const lower = text.toLowerCase();
            return lower.startsWith('generate') || 
                   lower.startsWith('draw') || 
                   lower.startsWith('make an image') || 
                   lower.startsWith('create an image') ||
                   lower.includes('photo of') ||
                   lower.includes('picture of');
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            const activeChat = chats.find(c => c.id === currentChatId);
            if (!activeChat) return;

            // Update chat title if it's the first user message
            if (activeChat.title === 'New Conversation') {
                activeChat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
                chatTitle.textContent = activeChat.title;
                renderHistory();
            }

            // Push User Message
            activeChat.messages.push({ role: 'user', content: text });
            userInput.value = '';
            userInput.style.height = 'auto';
            renderMessages();

            // Check if user is requesting high-quality realistic image generation
            if (isImageRequest(text)) {
                // Enhanced high quality parameters for ultra-realistic flux output
                const enhancedPrompt = encodeURIComponent(text + ", highly detailed, photorealistic, cinematic lighting, 8k resolution, sharp focus");
                const randomSeed = Math.floor(Math.random() * 10000000);
                const imageUrl = `https://image.pollinations.ai/prompt/${enhancedPrompt}?model=flux-realism&seed=${randomSeed}&nologo=true&enhance=true`;

                activeChat.messages.push({
                    role: 'ai',
                    type: 'image',
                    text: `Here is the high-quality image you requested: "${text}"`,
                    imageUrl: imageUrl
                });
                renderMessages();
            } else {
                // Standard text response handling via Pollinations AI text endpoint
                try {
                    const response = await fetch('https://text.pollinations.ai/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            messages: activeChat.messages.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content || m.text }))
                        })
                    });
                    const replyText = await response.text();
                    activeChat.messages.push({ role: 'ai', content: replyText });
                } catch (err) {
                    activeChat.messages.push({ role: 'ai', content: "I'm sorry, I encountered an error processing your text request." });
                }
                renderMessages();
            }
        }

        // Event Listeners
        sendBtn.onclick = handleSendMessage;
        userInput.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendMessage();
            }
        };

        newChatBtn.onclick = initNewChat;

        // Auto-resize textarea
        userInput.oninput = function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        };

        // Initialize first chat on startup
        initNewChat();
    </script>
</html>
