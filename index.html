<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sol AI</title>
    <style>
      :root {
        --bg-deep: #090610;
        --bg-surface: #130d20;
        --border-color: rgba(192, 132, 252, 0.15);
        --primary: #c084fc;
        --text-main: #f3e8ff;
        --text-muted: #a78bfa;
        --gradient-start: #e879f9;
        --gradient-end: #c084fc;
        --msg-user: linear-gradient(135deg, #7e22ce, #6b21a8);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
      body { background-color: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

      .sidebar {
        width: 280px; background-color: var(--bg-surface); border-right: 1px solid var(--border-color);
        display: flex; flex-direction: column; z-index: 100; transition: transform 0.3s ease-in-out; flex-shrink: 0;
      }
      .sidebar-top { padding: 20px; font-weight: 800; font-size: 1.6rem; color: var(--primary); }
      .sidebar-actions { padding: 0 16px 16px; }
      .btn-new-chat { background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); color: #fff; border: none; padding: 11px; border-radius: 10px; width: 100%; font-weight: 600; cursor: pointer; }
      .recent-chats-container { flex: 1; padding: 0 16px; color: var(--text-muted); font-size: 0.85rem; }
      .sidebar-footer { padding: 14px 16px; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border-color); }

      .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; overflow: hidden; }
      .chat-header { padding: 18px 28px; border-bottom: 1px solid var(--border-color); background: var(--bg-surface); display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
      .mobile-menu-toggle { display: none; background: var(--bg-deep); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 10px; cursor: pointer; }

      .user-avatar-badge { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; }
      .user-dropdown-menu { position: absolute; top: 70px; right: 28px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 14px; width: 140px; display: none; flex-direction: column; padding: 6px; z-index: 500; }
      .user-dropdown-menu.active { display: flex; }
      .dropdown-item.logout { background: transparent; border: none; color: #ef4444; padding: 10px; text-align: left; cursor: pointer; font-weight: 600; }

      .chat-messages-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
      .message-wrapper { display: flex; max-width: 800px; width: 100%; margin: 0 auto; }
      .message-wrapper.user { justify-content: flex-end; }
      .message-bubble { padding: 14px 18px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; }
      .message-wrapper.user .message-bubble { background: var(--msg-user); color: #fff; }
      .message-wrapper.assistant .message-bubble { background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main); }

      .chat-input-area { padding: 16px 24px; background: var(--bg-surface); border-top: 1px solid var(--border-color); display: flex; gap: 14px; max-width: 900px; width: calc(100% - 48px); margin: 0 auto 20px; border-radius: 16px; }
      .chat-input { flex: 1; background: var(--bg-deep); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; color: var(--text-main); outline: none; resize: none; }
      .send-btn { background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); border: none; color: #fff; width: 42px; height: 42px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

      /* AUTH OVERLAY */
      .auth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(9, 6, 16, 0.95); backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: center; z-index: 2000; }
      .auth-overlay.hidden { display: none !important; }
      .auth-card { background: var(--bg-surface); border: 1px solid var(--border-color); width: 400px; max-width: 90%; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 20px; }
      .auth-title { font-size: 1.6rem; font-weight: 700; text-align: center; color: var(--primary); }
      .auth-form { display: flex; flex-direction: column; gap: 16px; }
      .auth-field { display: flex; flex-direction: column; gap: 6px; }
      .auth-label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
      .auth-input { background: var(--bg-deep); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; color: var(--text-main); outline: none; }
      .auth-btn { background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; }

      .sidebar-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 99; display: none; }
      .sidebar-backdrop.active { display: block; }

      @media (max-width: 768px) {
        .mobile-menu-toggle { display: flex; align-items: center; justify-content: center; }
        .sidebar { position: fixed; height: 100vh; transform: translateX(-100%); }
        .sidebar.open { transform: translateX(0); }
      }
    </style>
  </head>
  <body>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">Sol Ai</div>
      <div class="sidebar-actions">
        <button class="btn-new-chat">+ New chat</button>
      </div>
      <div class="recent-chats-container">
        <div style="text-transform:uppercase; font-size:0.75rem; margin-bottom:8px;">History</div>
        <div>No recent chats</div>
      </div>
      <div class="sidebar-footer">Copyright Aayush Dc</div>
    </aside>

    <main class="main-content">
      <header class="chat-header">
        <button class="mobile-menu-toggle" id="mobileMenuBtn">&#9776;</button>
        <div class="user-menu-container">
          <div class="user-avatar-badge" id="userAvatarBadge">A</div>
          <div class="user-dropdown-menu" id="userDropdown">
            <button class="dropdown-item logout" id="logoutBtn">Logout</button>
          </div>
        </div>
      </header>

      <div class="chat-messages-container" id="chatMessages">
        <div class="message-wrapper assistant">
          <div class="message-bubble">Hello! How can I help you today?</div>
        </div>
      </div>

      <div class="chat-input-area">
        <textarea class="chat-input" id="chatInput" placeholder="Message Sol Ai..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn">➤</button>
      </div>
    </main>

    <div class="auth-overlay" id="authOverlay">
      <div class="auth-card">
        <div class="auth-title">Welcome to Sol Ai</div>
        <div class="auth-form">
          <div class="auth-field">
            <label class="auth-label">Username / Email</label>
            <input type="text" class="auth-input" id="authEmail" value="user@example.com" />
          </div>
          <div class="auth-field">
            <label class="auth-label">Password</label>
            <input type="password" class="auth-input" id="authPassword" value="password" />
          </div>
          <button type="button" class="auth-btn" id="bypassAuthBtn">Continue</button>
        </div>
      </div>
    </div>

    <script>
      const authOverlay = document.getElementById('authOverlay');
      const bypassAuthBtn = document.getElementById('bypassAuthBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const userAvatarBadge = document.getElementById('userAvatarBadge');
      const userDropdown = document.getElementById('userDropdown');
      
      const mobileMenuBtn = document.getElementById('mobileMenuBtn');
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');

      const chatInput = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const chatMessages = document.getElementById('chatMessages');

      // Instantly hide login screen on click without validation traps
      bypassAuthBtn.addEventListener('click', () => {
        authOverlay.classList.add('hidden');
      });

      // Bring back login screen on logout
      logoutBtn.addEventListener('click', () => {
        authOverlay.classList.remove('hidden');
        userDropdown.classList.remove('active');
      });

      // User menu toggle
      userAvatarBadge.addEventListener('click', (e) => {
        e.stopPropagation();
        userDropdown.classList.toggle('active');
      });
      document.addEventListener('click', () => userDropdown.classList.remove('active'));

      // Mobile menu toggle
      function toggleMenu() {
        sidebar.classList.toggle('open');
        backdrop.classList.toggle('active');
      }
      mobileMenuBtn.addEventListener('click', toggleMenu);
      backdrop.addEventListener('click', toggleMenu);

      // Chat functionality
      function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        chatMessages.innerHTML += `<div class="message-wrapper user"><div class="message-bubble">${text}</div></div>`;
        chatInput.value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        setTimeout(() => {
          chatMessages.innerHTML += `<div class="message-wrapper assistant"><div class="message-bubble">I am running locally! How else can I assist you?</div></div>`;
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 500);
      }

      sendBtn.addEventListener('click', sendMessage);
      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    </script>
  </body>
</html>
