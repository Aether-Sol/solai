<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nep AI</title>
  <style>
    :root {
      --bg-main: #1e1e2f;
      --bg-sidebar: #151522;
      --bg-panel: #27293d;
      --bg-hover: #32344a;
      --border-color: #383c56;
      --text-main: #ffffff;
      --text-muted: #a0a5cbd0;
      --accent: #5e72e4;
      --accent-hover: #4863c9;
      --danger: #f5365c;
      --success: #2dce89;
      --user-bubble: #313348;
      --ai-bubble: #27293d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 100; }
    .sidebar-header { padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
    .new-chat-btn { flex: 1; background-color: var(--accent); color: #fff; border: none; padding: 10px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
    .new-chat-btn:hover { background-color: var(--accent-hover); }
    .history-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .history-item { padding: 10px 12px; border-radius: 6px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.2s, color 0.2s; }
    .history-item:hover { background-color: var(--bg-hover); color: var(--text-main); }
    
    /* Main Content Area */
    .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; background-color: var(--bg-main); }
    .top-nav { height: 60px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background-color: var(--bg-sidebar); }
    .nav-left, .nav-right { display: flex; align-items: center; gap: 12px; }
    .icon-btn { background: none; border: none; color: var(--text-main); cursor: pointer; font-size: 1.2rem; padding: 6px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .icon-btn:hover { background-color: var(--bg-hover); }
    
    /* Model Selector Dropdown & Status Lights */
    .dropdown { position: relative; display: inline-block; }
    .dropdown-btn { background: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .dropdown-content { display: none; position: absolute; top: 100%; left: 0; margin-top: 4px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; min-width: 180px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); z-index: 10; }
    .dropdown-content.show { display: block; }
    .dropdown-item { padding: 10px 14px; font-size: 0.85rem; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .dropdown-item:hover { background: var(--bg-hover); }
    .dropdown-item.active { color: var(--accent); font-weight: bold; }
    
    .status-light { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-light.online { background-color: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-light.offline { background-color: var(--danger); box-shadow: 0 0 6px var(--danger); }

    /* Chat Messages Container */
    .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
    .welcome-hero { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; gap: 12px; color: var(--text-muted); }
    .welcome-hero h1 { font-size: 2.2rem; color: var(--text-main); font-weight: 800; }

    .message { display: flex; flex-direction: column; max-width: 75%; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { align-self: flex-end; }
    .message.assistant { align-self: flex-start; }
    
    .message-bubble { padding: 14px 18px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; word-break: break-word; }
    .message.user .message-bubble { background-color: var(--user-bubble); color: var(--text-main); border-bottom-right-radius: 4px; }
    .message.assistant .message-bubble { background-color: var(--ai-bubble); border: 1px solid var(--border-color); color: var(--text-main); border-bottom-left-radius: 4px; }
    .message img { max-width: 250px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border-color); }

    .message-actions { display: flex; gap: 10px; margin-top: 6px; font-size: 0.75rem; }
    .tts-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; }
    .tts-btn:hover { background-color: var(--bg-hover); color: var(--text-main); }
    .tts-btn.speaking { color: var(--accent); font-weight: bold; }

    /* Input Area */
    .input-container-wrapper { padding: 16px 24px 24px; background: linear-gradient(to top, var(--bg-main) 80%, transparent); }
    .input-box { background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); transition: border-color 0.2s; }
    .input-box:focus-within { border-color: var(--accent); }
    
    .image-preview-container { display: none; align-items: center; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-color); }
    .image-preview-container.active { display: flex; }
    .image-preview-thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color); }
    .remove-image-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.8rem; font-weight: 600; }

    .input-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .input-field { flex: 1; background: none; border: none; color: var(--text-main); font-size: 0.95rem; outline: none; resize: none; max-height: 120px; }
    .input-actions { display: flex; align-items: center; gap: 8px; }
    .action-icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; padding: 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: color 0.2s, background 0.2s; }
    .action-icon-btn:hover { color: var(--text-main); background-color: var(--bg-hover); }
    .action-icon-btn.active { color: #fff; background-color: var(--danger); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
    
    .send-btn { background-color: var(--accent); color: #fff; border: none; width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; }
    .send-btn:hover { background-color: var(--accent-hover); }

    @media(max-width: 768px) {
      .sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .message { max-width: 90%; }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" id="newChatBtn">
        <span>+</span> New Chat
      </button>
    </div>
    <div class="history-list" id="historyList">
      <div style="color: var(--text-muted); font-size: 0.8rem;">No recent chats</div>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="main-content">
    <div class="top-nav">
      <div class="nav-left">
        <button class="icon-btn" id="menuToggleBtn">☰</button>
        <div class="dropdown">
          <button class="dropdown-btn" id="dropdownBtn">
            <span id="currentModelLabel">Sol 1</span> ▾
          </button>
          <div class="dropdown-content" id="dropdownContent">
            <div class="dropdown-item active" data-model="qwen/qwen3.6-27b">
              <span>Sol 1</span> <span class="status-light online" title="Online"></span>
            </div>
            <div class="dropdown-item" data-model="llama-3.3-70b-versatile">
              <span>Sol 2</span> <span class="status-light online" title="Online"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Messages -->
    <div class="chat-messages" id="chatMessages">
      <div class="welcome-hero" id="welcomeHero">
        <h1>Hello! I am Nep AI</h1>
        <p>How can I help you today?</p>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-container-wrapper">
      <div class="input-box">
        <div class="image-preview-container" id="imagePreviewContainer">
          <img id="imagePreviewThumb" class="image-preview-thumb" src="" alt="Preview">
          <span style="font-size: 0.8rem; color: var(--text-muted); flex: 1;">Image attached</span>
          <button class="remove-image-btn" id="removeImageBtn">Remove</button>
        </div>
        <div class="input-controls">
          <textarea class="input-field" id="userInput" placeholder="Message Nep AI..." rows="1"></textarea>
          <div class="input-actions">
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
            <button class="action-icon-btn" id="attachBtn" title="Upload Image">📎</button>
            <button class="action-icon-btn" id="voiceModeBtn" title="Live Voice Mode">🎙️</button>
            <button class="send-btn" id="sendBtn">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // HARDCODED API KEY AS REQUESTED
    const GROQ_API_KEY = "gsk_your_actual_api_key_here"; 

    let selectedModel = "qwen/qwen3.6-27b";
    let conversationHistory = [];
    let savedConversations = JSON.parse(localStorage.getItem('nep_ai_chat_history') || '[]');
    let currentBase64Image = null;
    let currentAbortController = null;
    let isVoiceModeActive = false;
    let recognition = null;
    let currentAudio = null;

    const sidebar = document.getElementById('sidebar');
    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const dropdownBtn = document.getElementById('dropdownBtn');
    const dropdownContent = document.getElementById('dropdownContent');
    const currentModelLabel = document.getElementById('currentModelLabel');
    const chatMessages = document.getElementById('chatMessages');
    const welcomeHero = document.getElementById('welcomeHero');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const imageInput = document.getElementById('imageInput');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const imagePreviewThumb = document.getElementById('imagePreviewThumb');
    const removeImageBtn = document.getElementById('removeImageBtn');
    const voiceModeBtn = document.getElementById('voiceModeBtn');
    const historyList = document.getElementById('historyList');
    const newChatBtn = document.getElementById('newChatBtn');

    menuToggleBtn.addEventListener('click', () => sidebar.classList.toggle('open'));

    dropdownBtn.addEventListener('click', () => dropdownContent.classList.toggle('show'));
    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', (e) => {
        document.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('active'));
        const targetItem = e.currentTarget;
        targetItem.classList.add('active');
        selectedModel = targetItem.getAttribute('data-model');
        currentModelLabel.textContent = targetItem.querySelector('span').textContent;
        dropdownContent.classList.remove('show');
      });
    });
    window.addEventListener('click', (e) => {
      if (!dropdownBtn.contains(e.target) && !dropdownContent.contains(e.target)) {
        dropdownContent.classList.remove('show');
      }
    });

    attachBtn.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          currentBase64Image = event.target.result;
          imagePreviewThumb.src = currentBase64Image;
          imagePreviewContainer.classList.add('active');
        };
        reader.readAsDataURL(file);
      }
    });
    removeImageBtn.addEventListener('click', () => {
      currentBase64Image = null;
      imageInput.value = '';
      imagePreviewContainer.classList.remove('active');
    });

    userInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    // ROBUST BLOB TTS LOGIC
    async function speakText(buttonElement, text, onCompleteCallback = null) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }

      if (buttonElement && buttonElement.classList.contains('speaking')) { 
        buttonElement.classList.remove('speaking'); 
        buttonElement.innerHTML = '🔊 Listen'; 
        if (onCompleteCallback) onCompleteCallback(); 
        return; 
      }

      document.querySelectorAll('.tts-btn').forEach(btn => { 
        btn.classList.remove('speaking'); 
        btn.innerHTML = '🔊 Listen'; 
      });

      if (buttonElement) { 
        buttonElement.classList.add('speaking'); 
        buttonElement.innerHTML = '⏹ Stop'; 
      }

      const cleanText = text.replace(/[#*_`]/g, '').slice(0, 300);
      const url = `https://api.streamelements.com/kappa/v2/speech?voice=Brian&text=${encodeURIComponent(cleanText)}`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Audio stream unavailable');
        
        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);
        
        const audio = new Audio(audioUrl);
        currentAudio = audio;

        audio.play().catch(err => {
          console.error("Audio playback error:", err);
          if (buttonElement) {
            buttonElement.classList.remove('speaking');
            buttonElement.innerHTML = '🔊 Listen';
          }
          if (onCompleteCallback) onCompleteCallback();
        });

        audio.onended = () => {
          if (buttonElement) {
            buttonElement.classList.remove('speaking');
            buttonElement.innerHTML = '🔊 Listen';
          }
          if (currentAudio === audio) currentAudio = null;
          URL.revokeObjectURL(audioUrl);
          if (onCompleteCallback) onCompleteCallback();
        };

        audio.onerror = () => {
          if (buttonElement) {
            buttonElement.classList.remove('speaking');
            buttonElement.innerHTML = '🔊 Listen';
          }
          URL.revokeObjectURL(audioUrl);
          if (onCompleteCallback) onCompleteCallback();
        };

      } catch (err) {
        console.error("TTS Network Error:", err);
        if (buttonElement) {
          buttonElement.classList.remove('speaking');
          buttonElement.innerHTML = '🔊 Listen';
        }
        if (onCompleteCallback) onCompleteCallback();
      }
    }

    function renderHistory() {
      if (savedConversations.length === 0) { 
        historyList.innerHTML = `<div style="color: var(--text-muted); font-size: 0.8rem;">No recent chats</div>`; 
        return; 
      }
      historyList.innerHTML = '';
      savedConversations.forEach((chat, idx) => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.textContent = chat.title;
        item.addEventListener('click', () => { loadChat(idx); if (window.innerWidth <= 768) sidebar.classList.remove('open'); });
        historyList.appendChild(item);
      });
    }

    function loadChat(index) {
      stopVoiceMode(); 
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      if (currentAbortController) currentAbortController.abort();
      conversationHistory = [...savedConversations[index].messages];
      chatMessages.innerHTML = '';
      if (welcomeHero) welcomeHero.remove();
      conversationHistory.forEach(msg => {
        let content = msg.content, img = null;
        if (Array.isArray(msg.content)) {
          content = msg.content.find(c => c.type === 'text')?.text || '';
          img = msg.content.find(c => c.type === 'image_url')?.image_url.url || null;
        }
        appendMessageUI(msg.role === 'user' ? 'user' : 'assistant', content, img);
      });
    }

    newChatBtn.addEventListener('click', () => {
      stopVoiceMode(); 
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      if (currentAbortController) currentAbortController.abort();
      if (conversationHistory.length > 0) saveCurrentChatToHistory();
      conversationHistory = [];
      chatMessages.innerHTML = `<div class="welcome-hero" id="welcomeHero"><h1>Hello! I am Nep AI</h1><p>How can I help you today?</p></div>`;
      if (window.innerWidth <= 768) sidebar.classList.remove('open');
    });

    function saveCurrentChatToHistory() {
      if (conversationHistory.length === 0) return;
      const first = conversationHistory.find(m => m.role === 'user');
      let title = "New Chat";
      if (first) {
        title = typeof first.content === 'string' ? first.content.slice(0, 30) + '...' : (first.content.find(c => c.type === 'text')?.text.slice(0, 30) + '...' || "Image Query");
      }
      savedConversations.unshift({ title, messages: [...conversationHistory] });
      if (savedConversations.length > 15) savedConversations.pop();
      localStorage.setItem('nep_ai_chat_history', JSON.stringify(savedConversations));
      renderHistory();
    }

    function appendMessageUI(role, text, imageUrl = null) {
      const wh = document.getElementById('welcomeHero');
      if (wh) wh.remove();

      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';

      if (imageUrl) {
        const img = document.createElement('img');
        img.src = imageUrl;
        bubble.appendChild(img);
      }

      const textSpan = document.createElement('div');
      textSpan.textContent = text;
      bubble.appendChild(textSpan);
      messageDiv.appendChild(bubble);

      if (role === 'assistant') {
        const actions = document.createElement('div');
        actions.className = 'message-actions';
        const ttsBtn = document.createElement('button');
        ttsBtn.className = 'tts-btn';
        ttsBtn.innerHTML = '🔊 Listen';
        ttsBtn.addEventListener('click', () => speakText(ttsBtn, text));
        actions.appendChild(ttsBtn);
        messageDiv.appendChild(actions);
      }

      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return messageDiv;
    }

    async function sendMessage(overrideText = null, isVoiceTriggered = false) {
      const text = overrideText || userInput.value.trim();
      if (!text && !currentBase64Image) return;

      if (!overrideText) {
        userInput.value = '';
        userInput.style.height = 'auto';
      }

      let messagePayloadContent = text;
      let activeImage = currentBase64Image;

      if (activeImage) {
        messagePayloadContent = [
          { type: "text", text: text || "Describe this image." },
          { type: "image_url", image_url: { url: activeImage } }
        ];
        currentBase64Image = null;
        imagePreviewContainer.classList.remove('active');
        imageInput.value = '';
      }

      appendMessageUI('user', text || "[Image Attached]", activeImage);
      conversationHistory.push({ role: 'user', content: messagePayloadContent });

      const assistantMsgDiv = appendMessageUI('assistant', 'Thinking...');
      const assistantTextSpan = assistantMsgDiv.querySelector('.message-bubble div:last-child');
      const ttsButton = assistantMsgDiv.querySelector('.tts-btn');

      currentAbortController = new AbortController();

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: selectedModel,
            messages: conversationHistory,
            temperature: 0.7,
            max_tokens: 1024
          }),
          signal: currentAbortController.signal
        });

        if (!response.ok) throw new Error("Failed to communicate with Groq API.");
        const data = await response.json();
        const reply = data.choices[0].message.content;

        assistantTextSpan.textContent = reply;
        conversationHistory.push({ role: 'assistant', content: reply });
        saveCurrentChatToHistory();

        if (isVoiceTriggered) {
          speakText(ttsButton, reply, () => {
            if (isVoiceModeActive) startVoiceRecognition();
          });
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          assistantTextSpan.textContent = "Error: Failed to fetch response. Please verify your Groq API key.";
          console.error(err);
        }
      } finally {
        currentAbortController = null;
      }
    }

    sendBtn.addEventListener('click', () => sendMessage());
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function startVoiceRecognition() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("Speech recognition is not supported in this browser.");
        stopVoiceMode();
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onresult = (event) => {
        const speechResult = event.results[0][0].transcript;
        if (isVoiceModeActive) {
          sendMessage(speechResult, true);
        }
      };

      recognition.onerror = () => {
        if (isVoiceModeActive) setTimeout(startVoiceRecognition, 1000);
      };

      try {
        recognition.start();
      } catch (e) {
        console.error(e);
      }
    }

    function stopVoiceMode() {
      isVoiceModeActive = false;
      voiceModeBtn.classList.remove('active');
      if (recognition) {
        try { recognition.stop(); } catch(e){}
        recognition = null;
      }
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
    }

    voiceModeBtn.addEventListener('click', () => {
      isVoiceModeActive = !isVoiceModeActive;
      if (isVoiceModeActive) {
        voiceModeBtn.classList.add('active');
        startVoiceRecognition();
      } else {
        stopVoiceMode();
      }
    });

    renderHistory();
  </script>
</body>
</html>
