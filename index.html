<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sol AI - Groq Vision Edition</title>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      :root {
        --bg-deep: #121212;
        --bg-surface: #1e1e1e;
        --border-color: rgba(255, 255, 255, 0.1);
        --primary: #3b82f6;
        --text-main: #f9fafb;
        --text-muted: #9ca3af;
        --gradient-start: #60a5fa;
        --gradient-end: #3b82f6;
        --msg-user: linear-gradient(135deg, #2563eb, #1d4ed8);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
      
      html, body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        position: fixed;
        font-size: 15px;
      }

      .app-container {
        display: flex;
        width: 100%;
        height: 100%;
        height: 100dvh;
        position: relative;
        overflow: hidden;
      }

      .sidebar {
        width: 280px; 
        background-color: var(--bg-surface); 
        border-right: 1px solid var(--border-color);
        display: flex; 
        flex-direction: column; 
        z-index: 100; 
        transition: transform 0.3s ease-in-out; 
        flex-shrink: 0;
        height: 100%;
      }
      .sidebar-top { padding: 18px 20px; font-weight: 800; font-size: 1.5rem; color: var(--primary); display: flex; align-items: center; justify-content: space-between; }
      .sidebar-actions { padding: 0 16px 16px; }
      .btn-new-chat { background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); color: #fff; border: none; padding: 11px; border-radius: 10px; width: 100%; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
      .recent-chats-container { flex: 1; padding: 0 16px; color: var(--text-muted); font-size: 0.85rem; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
      
      .history-item {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-color);
        padding: 8px 10px;
        border-radius: 8px;
        color: var(--text-main);
        font-size: 0.8rem;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .history-item:hover { background: rgba(255, 255, 255, 0.06); }

      .sidebar-footer { padding: 14px 16px; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border-color); }

      .main-content { 
        flex: 1; 
        display: flex; 
        flex-direction: column; 
        height: 100%;
        height: 100dvh;
        position: relative; 
        overflow: hidden; 
        min-width: 0;
      }
      
      .chat-header { 
        padding: 12px 16px; 
        border-bottom: 1px solid var(--border-color); 
        background: var(--bg-surface); 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        flex-shrink: 0;
      }
      
      .mobile-menu-toggle { 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        background: var(--bg-deep); 
        border: 1px solid var(--border-color); 
        color: var(--text-main); 
        padding: 8px 12px; 
        border-radius: 10px; 
        cursor: pointer; 
        font-size: 1.1rem;
      }

      .header-right { display: flex; align-items: center; gap: 8px; position: relative; }

      .neon-title {
        font-size: 1.2rem;
        font-weight: 800;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 0 0 5px rgba(59, 130, 246, 0.8), 0 0 10px rgba(59, 130, 246, 0.8);
      }

      .chat-messages-container { 
        flex: 1; 
        overflow-y: auto; 
        padding: 16px; 
        display: flex; 
        flex-direction: column; 
        gap: 14px; 
        -webkit-overflow-scrolling: touch;
      }
      
      .message-wrapper { display: flex; flex-direction: column; max-width: 800px; width: 100%; margin: 0 auto; gap: 4px; }
      .message-wrapper.user { align-items: flex-end; }
      .message-wrapper.assistant { align-items: flex-start; }
      
      .message-bubble { padding: 11px 15px; border-radius: 14px; font-size: 0.9rem; line-height: 1.5; word-break: break-word; width: 100%; }
      .message-wrapper.user .message-bubble { background: var(--msg-user); color: #fff; border-bottom-right-radius: 4px; }
      .message-wrapper.assistant .message-bubble { background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main); border-bottom-left-radius: 4px; }

      .message-bubble p { margin-bottom: 8px; }
      .message-bubble p:last-child { margin-bottom: 0; }
      .message-bubble pre { background: #0a0a0a; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
      .message-bubble code { font-family: monospace; background: rgba(255,255,255,0.1); padding: 2px 4px; border-radius: 4px; font-size: 0.85rem; }
      .message-bubble pre code { background: transparent; padding: 0; }
      .message-bubble ul, .message-bubble ol { margin-left: 20px; margin-bottom: 8px; }
      
      /* Image inside chat bubbles */
      .chat-img-preview { max-width: 200px; max-height: 200px; border-radius: 8px; margin-bottom: 8px; display: block; object-fit: cover; }

      .msg-footer { display: flex; align-items: center; gap: 6px; padding: 0 4px; }

      .tts-btn {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 0.75rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .tts-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }

      .chat-input-wrapper {
        padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)) 12px;
        background: var(--bg-surface);
        border-top: 1px solid var(--border-color);
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .stop-gen-container { display: flex; justify-content: center; max-width: 900px; width: 100%; margin: 0 auto; }

      .stop-btn {
        background: rgba(239, 68, 68, 0.2);
        border: 1px solid rgba(239, 68, 68, 0.5);
        color: #f87171;
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        display: none;
        align-items: center;
        gap: 6px;
      }
      .stop-btn.active { display: flex; }
      .stop-btn:hover { background: rgba(239, 68, 68, 0.3); }

      /* Attached image indicator preview area above textarea */
      .selected-image-preview-container {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 4px 8px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        width: fit-content;
      }
      .selected-image-preview-container.active { display: flex; }
      .selected-thumb { width: 36px; height: 36px; object-fit: cover; border-radius: 4px; }
      .remove-img-btn { background: transparent; border: none; color: #f87171; cursor: pointer; font-size: 1rem; font-weight: bold; }

      .chat-input-area { 
        display: flex; 
        align-items: flex-end;
        gap: 8px; 
        max-width: 900px; 
        width: 100%; 
        margin: 0 auto; 
        background: var(--bg-deep);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 6px 10px;
      }
      
      .attach-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 1.2rem;
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2px;
      }
      .attach-btn:hover { color: var(--text-main); }

      .chat-input { 
        flex: 1; 
        background: transparent; 
        border: none; 
        color: var(--text-main); 
        outline: none; 
        resize: none; 
        max-height: 90px;
        font-size: 0.9rem;
        padding: 6px 0;
        line-height: 1.3;
      }
      
      .send-btn { 
        background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); 
        border: none; 
        color: #fff; 
        width: 34px; 
        height: 34px; 
        border-radius: 9px; 
        cursor: pointer; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        flex-shrink: 0;
        margin-bottom: 2px;
      }

      .sidebar-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 99; display: none; }
      .sidebar-backdrop.active { display: block; }

      @media (max-width: 768px) {
        .sidebar { position: fixed; height: 100%; transform: translateX(-100%); }
        .sidebar.open { transform: translateX(0); }
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <span>Sol Ai</span>
        </div>
        <div class="sidebar-actions">
          <button class="btn-new-chat" id="newChatBtn">+ New chat</button>
        </div>
        <div class="recent-chats-container" id="historyListContainer">
          <div style="text-transform:uppercase; font-size:0.7rem; margin-bottom:6px; color: var(--text-muted);">History</div>
          <div id="historyList" style="display: flex; flex-direction: column; gap: 6px;">
            <div style="color: var(--text-muted); font-size: 0.8rem;">No recent chats</div>
          </div>
        </div>
        <div class="sidebar-footer">© Aayush Dc</div>
      </aside>

      <main class="main-content">
        <header class="chat-header">
          <button class="mobile-menu-toggle" id="mobileMenuBtn">&#9776;</button>
          <div class="header-right">
            <div class="neon-title">Sol Ai</div>
          </div>
        </header>

        <div class="chat-messages-container" id="chatMessages">
          <div class="message-wrapper assistant">
            <div class="message-bubble"><p>Hello! I am Sol AI with Vision capabilities. Upload an image or ask me anything!</p></div>
            <div class="msg-footer">
              <button class="tts-btn" onclick="speakText(this, 'Hello! I am Sol AI with Vision capabilities. Upload an image or ask me anything!')">🔊 Listen</button>
            </div>
          </div>
        </div>

        <div class="chat-input-wrapper">
          <div class="stop-gen-container">
            <button class="stop-btn" id="stopBtn">⏹ Stop Generating</button>
          </div>
          
          <!-- Image selection preview wrapper -->
          <div class="selected-image-preview-container" id="imagePreviewContainer">
            <img id="selectedThumb" class="selected-thumb" src="" alt="attachment" />
            <span style="font-size: 0.8rem; color: var(--text-muted);">Image attached</span>
            <button class="remove-img-btn" id="removeImgBtn">&times;</button>
          </div>

          <div class="chat-input-area">
            <input type="file" id="imageInput" accept="image/*" style="display: none;" />
            <button class="attach-btn" id="attachBtn" title="Attach Image">📎</button>
            <textarea class="chat-input" id="chatInput" placeholder="Message Sol Ai or ask about an image..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn">➤</button>
          </div>
        </div>
      </main>
    </div>

    <script>
      const GROQ_API_KEY = "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";

      const mobileMenuBtn = document.getElementById('mobileMenuBtn');
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');

      const chatInput = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const stopBtn = document.getElementById('stopBtn');
      const chatMessages = document.getElementById('chatMessages');
      const newChatBtn = document.getElementById('newChatBtn');
      const historyList = document.getElementById('historyList');
      const attachBtn = document.getElementById('attachBtn');
      const imageInput = document.getElementById('imageInput');
      const imagePreviewContainer = document.getElementById('imagePreviewContainer');
      const selectedThumb = document.getElementById('selectedThumb');
      const removeImgBtn = document.getElementById('removeImgBtn');

      let conversationHistory = [];
      let savedConversations = JSON.parse(localStorage.getItem('sol_chat_history') || '[]');
      let currentAbortController = null;
      let attachedBase64Image = null;

      // Handle image file selection
      attachBtn.addEventListener('click', () => imageInput.click());

      imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(uploadEvent) {
          attachedBase64Image = uploadEvent.target.result;
          selectedThumb.src = attachedBase64Image;
          imagePreviewContainer.classList.add('active');
        };
        reader.readAsDataURL(file);
      });

      removeImgBtn.addEventListener('click', () => {
        attachedBase64Image = null;
        imageInput.value = '';
        imagePreviewContainer.classList.remove('active');
      });

      function speakText(buttonElement, text) {
        if (!('speechSynthesis' in window)) {
          alert("Text-to-speech is not supported on this browser/device.");
          return;
        }

        window.speechSynthesis.cancel();

        if (buttonElement.classList.contains('speaking')) {
          buttonElement.classList.remove('speaking');
          buttonElement.innerHTML = '🔊 Listen';
          return;
        }

        document.querySelectorAll('.tts-btn').forEach(btn => {
          btn.classList.remove('speaking');
          btn.innerHTML = '🔊 Listen';
        });

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const preferredVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Online') || v.name.includes('Microsoft'))) || voices[0];
        if (preferredVoice) utterance.voice = preferredVoice;

        buttonElement.classList.add('speaking');
        buttonElement.innerHTML = '⏹ Stop';

        utterance.onend = () => {
          buttonElement.classList.remove('speaking');
          buttonElement.innerHTML = '🔊 Listen';
        };
        utterance.onerror = () => {
          buttonElement.classList.remove('speaking');
          buttonElement.innerHTML = '🔊 Listen';
        };

        window.speechSynthesis.speak(utterance);
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
      }

      function renderHistory() {
        if (savedConversations.length === 0) {
          historyList.innerHTML = `<div style="color: var(--text-muted); font-size: 0.8rem;">No recent chats</div>`;
          return;
        }
        historyList.innerHTML = '';
        savedConversations.forEach((chat, idx) => {
          const item = document.createElement('div');
          item.className = 'history-item';
          item.textContent = chat.title;
          item.addEventListener('click', () => {
            loadChat(idx);
            if (window.innerWidth <= 768) toggleMenu();
          });
          historyList.appendChild(item);
        });
      }

      function loadChat(index) {
        window.speechSynthesis.cancel();
        if (currentAbortController) currentAbortController.abort();
        stopBtn.classList.remove('active');

        const chat = savedConversations[index];
        conversationHistory = [...chat.messages];
        chatMessages.innerHTML = '';
        conversationHistory.forEach(msg => {
          // Render content safely handling text vs multimodal content array
          let displayContent = msg.content;
          let displayImage = null;
          if (Array.isArray(msg.content)) {
            const textPart = msg.content.find(c => c.type === 'text');
            const imgPart = msg.content.find(c => c.type === 'image_url');
            displayContent = textPart ? textPart.text : '';
            displayImage = imgPart ? imgPart.image_url.url : null;
          }
          appendMessageUI(msg.role === 'user' ? 'user' : 'assistant', displayContent, displayImage);
        });
      }

      function toggleMenu() {
        sidebar.classList.toggle('open');
        backdrop.classList.toggle('active');
      }
      mobileMenuBtn.addEventListener('click', toggleMenu);
      backdrop.addEventListener('click', toggleMenu);

      newChatBtn.addEventListener('click', () => {
        window.speechSynthesis.cancel();
        if (currentAbortController) currentAbortController.abort();
        stopBtn.classList.remove('active');

        if (conversationHistory.length > 0) saveCurrentChatToHistory();
        conversationHistory = [];
        chatMessages.innerHTML = `
          <div class="message-wrapper assistant">
            <div class="message-bubble"><p>New chat started. How can I help you?</p></div>
            <div class="msg-footer">
              <button class="tts-btn" onclick="speakText(this, 'New chat started. How can I help you?')">🔊 Listen</button>
            </div>
          </div>
        `;
        if (window.innerWidth <= 768) toggleMenu();
      });

      function saveCurrentChatToHistory() {
        if (conversationHistory.length === 0) return;
        const firstUserMsg = conversationHistory.find(m => m.role === 'user');
        let titleText = 'New Chat';
        if (firstUserMsg) {
          if (typeof firstUserMsg.content === 'string') {
            titleText = firstUserMsg.content.slice(0, 30) + '...';
          } else if (Array.isArray(firstUserMsg.content)) {
            const t = firstUserMsg.content.find(c => c.type === 'text');
            titleText = t ? t.text.slice(0, 30) + '...' : 'Image Query';
          }
        }
        savedConversations.unshift({ title: titleText, messages: [...conversationHistory] });
        if (savedConversations.length > 15) savedConversations.pop();
        localStorage.setItem('sol_chat_history', JSON.stringify(savedConversations));
        renderHistory();
      }

      async function callGroqCloudAPI(promptText, imageUrl) {
        const loadingId = 'msg-' + Date.now();
        chatMessages.innerHTML += `
          <div class="message-wrapper assistant" id="${loadingId}">
            <div class="message-bubble" style="opacity: 0.7;">Thinking...</div>
          </div>
        `;
        chatMessages.scrollTop = chatMessages.scrollHeight;
        stopBtn.classList.add('active');

        currentAbortController = new AbortController();

        try {
          let userMessageContent;
          if (imageUrl) {
            userMessageContent = [
              { type: "text", text: promptText || "What is this image?" },
              { type: "image_url", image_url: { url
    imageUrl } }
            ];
          } else {
            userMessageContent = promptText;
          }

          conversationHistory.push({ role: 'user', content: userMessageContent });

          const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${GROQ_API_KEY}`
            },
            body: JSON.stringify({
              model: 'qwen/qwen2.5-vl-7b-instruct',
              messages: [
                { role: 'system', content: 'You are Sol Ai, a helpful assistant with vision capabilities.' },
                ...conversationHistory
              ],
              max_completion_tokens: 1024
            }),
            signal: currentAbortController.signal
          });

          const data = await response.json();
          const loadingElement = document.getElementById(loadingId);
          if (loadingElement) loadingElement.remove();
          stopBtn.classList.remove('active');

          if (data.choices && data.choices[0].message && data.choices[0].message.content) {
            const aiReply = data.choices[0].message.content;
            conversationHistory.push({ role: 'assistant', content: aiReply });
            appendMessageUI('assistant', aiReply);
            saveCurrentChatToHistory();
          } else if (data.error) {
            appendMessageUI('assistant', `API Error: ${data.error.message}`);
          } else {
            appendMessageUI('assistant', 'Error: Unexpected response format from GroqCloud API.');
          }
        } catch (error) {
          const loadingElement = document.getElementById(loadingId);
          if (loadingElement) loadingElement.remove();
          stopBtn.classList.remove('active');

          if (error.name === 'AbortError') {
            appendMessageUI('assistant', '_Generation stopped._');
            conversationHistory.push({ role: 'assistant', content: 'Generation stopped.' });
          } else {
            appendMessageUI('assistant', 'Network error connecting to GroqCloud API.');
          }
        }
      }

      stopBtn.addEventListener('click', () => {
        if (currentAbortController) currentAbortController.abort();
      });

      function appendMessageUI(sender, text, imageUrl = null) {
        let footerHtml = '';
        let formattedContent = '';
        let imageHtml = imageUrl ? `<img src="${imageUrl}" class="chat-img-preview" alt="Uploaded image" />` : '';

        if (sender === 'user') {
          const safeText = (text || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, '<br>');
          formattedContent = `${imageHtml}<p>${safeText}</p>`;
        } else {
          formattedContent = marked.parse(text || '');
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = formattedContent;
          const plainTextForSpeech = tempDiv.textContent || tempDiv.innerText || '';
          
          const encodedSpeechText = btoa(unescape(encodeURIComponent(plainTextForSpeech)));

          footerHtml = `
            <div class="msg-footer">
              <button class="tts-btn" onclick="speakEncodedText(this, '${encodedSpeechText}')">🔊 Listen</button>
            </div>
          `;
        }

        chatMessages.innerHTML += `
          <div class="message-wrapper ${sender}">
            <div class="message-bubble">${formattedContent}</div>
            ${footerHtml}
          </div>
        `;
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function speakEncodedText(buttonElement, base64Text) {
        const decodedText = decodeURIComponent(escape(atob(base64Text)));
        speakText(buttonElement, decodedText);
      }

      function handleSendMessage() {
        const text = chatInput.value.trim();
        const activeImage = attachedBase64Image;

        if (!text && !activeImage) return;

        appendMessageUI('user', text || 'Sent an image', activeImage);

        chatInput.value = '';
        chatInput.style.height = 'auto';
        attachedBase64Image = null;
        imageInput.value = '';
        imagePreviewContainer.classList.remove('active');

        callGroqCloudAPI(text, activeImage);
      }

      sendBtn.addEventListener('click', handleSendMessage);
      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage();
        }
      });

      renderHistory();
    </script>
  </body>
</html>
