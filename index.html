<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Nep AI - Professional Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      :root {
        --bg-deep: #0f0f10;
        --bg-surface: #1a181a;
        --border-color: rgba(220, 38, 38, 0.2);
        --primary: #dc2626;
        --accent-gold: #f59e0b;
        --text-main: #f9fafb;
        --text-muted: #9ca3af;
        --gradient-start: #dc2626;
        --gradient-end: #b91c1c;
        --msg-user: linear-gradient(135deg, #dc2626, #991b1b);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
      html, body { background-color: var(--bg-deep); color: var(--text-main); width: 100%; height: 100%; height: 100dvh; overflow: hidden; position: fixed; font-size: 15px; }
      .app-container { display: flex; width: 100%; height: 100%; height: 100dvh; position: relative; overflow: hidden; }
      
      .sidebar { width: 280px; background-color: var(--bg-surface); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 100; transition: transform 0.3s ease-in-out; flex-shrink: 0; height: 100%; position: relative; }
      .sidebar-top { padding: 18px 20px; font-weight: 800; font-size: 1.5rem; color: var(--accent-gold); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
      .sidebar-actions { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
      .btn-new-chat, .btn-settings { background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); color: #fff; border: none; padding: 10px; border-radius: 10px; width: 100%; font-weight: 600; cursor: pointer; font-size: 0.85rem; box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3); text-align: center; }
      .btn-settings { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-main); }
      .recent-chats-container { flex: 1; padding: 0 16px; color: var(--text-muted); font-size: 0.85rem; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
      .history-item { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); padding: 8px 10px; border-radius: 8px; color: var(--text-main); font-size: 0.8rem; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sidebar-footer { padding: 14px 16px; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border-color); }
      
      .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; height: 100dvh; position: relative; overflow: hidden; min-width: 0; }
      .chat-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); background: var(--bg-surface); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
      .header-left-group { display: flex; align-items: center; gap: 10px; }
      .mobile-menu-toggle { display: none; align-items: center; justify-content: center; background: var(--bg-deep); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 1.1rem; }
      
      .header-settings-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
      .header-settings-btn:hover { background: rgba(255, 255, 255, 0.1); }

      .neon-title { font-size: 1.2rem; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 8px rgba(245, 158, 11, 0.6); }
      
      .chat-messages-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
      
      .welcome-hero { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; gap: 8px; margin: auto; padding: 20px; }
      .welcome-hero h1 { font-size: 2.2rem; font-weight: 800; color: #fff; text-shadow: 0 0 15px rgba(220, 38, 38, 0.4); }
      .welcome-hero p { color: var(--text-muted); font-size: 1.05rem; }

      .message-wrapper { display: flex; flex-direction: column; max-width: 800px; width: 100%; margin: 0 auto; gap: 4px; }
      .message-wrapper.user { align-items: flex-end; }
      .message-wrapper.assistant { align-items: flex-start; }
      .message-bubble { padding: 11px 15px; border-radius: 14px; font-size: 0.9rem; line-height: 1.5; word-break: break-word; width: 100%; }
      .message-wrapper.user .message-bubble { background: var(--msg-user); color: #fff; border-bottom-right-radius: 4px; }
      .message-wrapper.assistant .message-bubble { background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main); border-bottom-left-radius: 4px; }
      .message-bubble p { margin-bottom: 8px; }
      .message-bubble pre { background: #0a0a0a; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
      .message-bubble code { font-family: monospace; background: rgba(255,255,255,0.1); padding: 2px 4px; border-radius: 4px; font-size: 0.85rem; }
      .chat-img-preview { max-width: 200px; max-height: 200px; border-radius: 8px; margin-bottom: 8px; display: block; object-fit: cover; }
      .msg-footer { display: flex; align-items: center; gap: 6px; padding: 0 4px; }
      .tts-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
      
      .chat-input-wrapper { padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)) 12px; background: var(--bg-surface); border-top: 1px solid var(--border-color); flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; }
      .stop-gen-container { display: flex; justify-content: center; max-width: 900px; width: 100%; margin: 0 auto; }
      .stop-btn { background: rgba(220, 38, 38, 0.2); border: 1px solid rgba(220, 38, 38, 0.5); color: #fca5a5; padding: 6px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: none; align-items: center; gap: 6px; }
      .stop-btn.active { display: flex; }
      .selected-image-preview-container { display: none; align-items: center; gap: 8px; padding: 4px 8px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; width: fit-content; }
      .selected-image-preview-container.active { display: flex; }
      .selected-thumb { width: 36px; height: 36px; object-fit: cover; border-radius: 4px; }
      .remove-img-btn { background: transparent; border: none; color: #f87171; cursor: pointer; font-size: 1rem; font-weight: bold; }
      .chat-input-area { display: flex; align-items: flex-end; gap: 8px; max-width: 900px; width: 100%; margin: 0 auto; background: var(--bg-deep); border: 1px solid var(--border-color); border-radius: 12px; padding: 6px 10px; }
      .attach-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }
      .chat-input { flex: 1; background: transparent; border: none; color: var(--text-main); outline: none; resize: none; max-height: 90px; font-size: 0.9rem; padding: 6px 0; line-height: 1.3; }
      .send-btn { background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); border: none; color: #fff; width: 34px; height: 34px; border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-bottom: 2px; }
      
      .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 99999; display: none; align-items: center; justify-content: center; pointer-events: auto; }
      .modal-overlay.active { display: flex; }
      .modal-content { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px; width: 90%; max-width: 350px; display: flex; flex-direction: column; gap: 14px; z-index: 100000; position: relative; pointer-events: auto; }
      .modal-title { font-size: 1.1rem; font-weight: 700; color: #fff; display: flex; justify-content: space-between; align-items: center; }
      .close-modal { background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
      .lang-select { background: var(--bg-deep); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 8px; outline: none; font-size: 0.9rem; width: 100%; }
      .save-settings-btn { background: var(--primary); color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; }

      .sidebar-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 99; display: none; }
      
      @media (max-width: 768px) {
        .sidebar { position: fixed; height: 100%; transform: translateX(-100%); }
        .sidebar.open { transform: translateX(0); }
        .mobile-menu-toggle { display: flex; }
        .sidebar-backdrop.active { display: block; }
      }
    </style>
  </head>
    <body>
    <div class="app-container">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      
      <!-- Settings Modal -->
      <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
          <div class="modal-title"><span id="txtModalHeader">Settings / भाषा</span><button class="close-modal" id="closeModal">&times;</button></div>
          <div style="font-size: 0.85rem; color: var(--text-muted);" id="txtModalSub">Choose your preferred language:</div>
          <select class="lang-select" id="languageSelect">
            <option value="English">English</option>
            <option value="Nepali">Nepali (नेपाली)</option>
            <option value="Hindi">Hindi (हिन्दी)</option>
          </select>
          <button class="save-settings-btn" id="saveSettingsBtn" type="button">Save Changes</button>
        </div>
      </div>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top"><span>Nep AI</span></div>
        <div class="sidebar-actions">
          <button class="btn-new-chat" id="newChatBtn">+ New Chat</button>
          <button class="btn-settings" id="settingsBtn">⚙️ Settings</button>
        </div>
        <div class="recent-chats-container" id="historyListContainer">
          <div style="text-transform:uppercase; font-size:0.7rem; margin-bottom:6px; color: var(--text-muted);" id="txtHistoryHeader">Chat History</div>
          <div id="historyList" style="display: flex; flex-direction: column; gap: 6px;"><div style="color: var(--text-muted); font-size: 0.8rem;" id="txtNoHistory">No recent chats</div></div>
        </div>
        <div class="sidebar-footer">© Aayush Dc</div>
      </aside>
      
      <main class="main-content">
        <header class="chat-header">
          <div class="header-left-group">
            <button class="mobile-menu-toggle" id="mobileMenuBtn">&#9776;</button>
            <button class="header-settings-btn" id="headerSettingsBtn" type="button">⚙️ <span id="txtHeaderSettings">Settings</span></button>
          </div>
          <div class="neon-title">Nep AI</div>
        </header>

        <div class="chat-messages-container" id="chatMessages">
          <div class="welcome-hero" id="welcomeHero">
            <h1 id="txtWelcomeTitle">Hello! I am Nep AI</h1>
            <p id="txtWelcomeSub">How can I help you today?</p>
          </div>
        </div>

        <div class="chat-input-wrapper">
          <div class="stop-gen-container"><button class="stop-btn" id="stopBtn">⏹ Stop Generating</button></div>
          <div class="selected-image-preview-container" id="imagePreviewContainer">
            <img id="selectedThumb" class="selected-thumb" src="" alt="attachment" />
            <span style="font-size: 0.8rem; color: var(--text-muted);" id="txtImgAttached">Image attached</span>
            <button class="remove-img-btn" id="removeImgBtn">&times;</button>
          </div>
          <div class="chat-input-area">
            <input type="file" id="imageInput" accept="image/*" style="display: none;" />
            <button class="attach-btn" id="attachBtn" title="Attach Image">📎</button>
            <textarea class="chat-input" id="chatInput" placeholder="Message Nep AI..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn">➤</button>
          </div>
        </div>
      </main>
    </div>

    <script>
      const GROQ_API_KEY = "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";
      
      const translations = {
        English: {
          newChat: "+ New Chat",
          settings: "Settings",
          historyHeader: "Chat History",
          noHistory: "No recent chats",
          modalHeader: "Settings / Language",
          modalSub: "Choose your preferred language:",
          saveBtn: "Save Changes",
          stopBtn: "⏹ Stop Generating",
          imgAttached: "Image attached",
          placeholder: "Message Nep AI...",
          greetingTitle: "Hello! I am Nep AI",
          greetingSub: "How can I help you today?",
          thinking: "Thinking...",
          listen: "🔊 Listen",
          stop: "⏹ Stop",
          defaultChatTitle: "New Chat",
          imageQuery: "Image Query",
          sentImage: "Sent an image",
          stoppedGen: "Generation stopped."
        },
        Nepali: {
          newChat: "+ नयाँ च्याट",
          settings: "सेटिङ्स",
          historyHeader: "कुराकानी इतिहास",
          noHistory: "कुनै इतिहास छैन",
          modalHeader: "सेटिङ्स / भाषा",
          modalSub: "तपाईंको मनपर्ने भाषा छान्नुहोस्:",
          saveBtn: "सेभ गर्नुहोस्",
          stopBtn: "⏹ जेनेरेसन रोक्नुहोस्",
          imgAttached: "तस्विर जोडिएको छ",
          placeholder: "Nep AI लाई सन्देश पठाउनुहोस्...",
          greetingTitle: "नमस्ते! म Nep AI हूँ",
          greetingSub: "आज म तपाईलाई कसरी सहयोग गर्न सक्छु?",
          thinking: "सोच्दैछ...",
          listen: "🔊 सुन्नुहोस्",
          stop: "⏹ रोक्नुहोस्",
          defaultChatTitle: "नयाँ च्याट",
          imageQuery: "तस्विर प्रश्न",
          sentImage: "तस्विर पठाइयो",
          stoppedGen: "जेनेरेसन रोकियो।"
        },
        Hindi: {
          newChat: "+ नया चैट",
          settings: "सेटिंग्ज़",
          historyHeader: "चैट इतिहास",
          noHistory: "कोई इतिहास नहीं",
          modalHeader: "सेटिंग्ज़ / भाषा",
          modalSub: "अपनी पसंदीदा भाषा चुनें:",
          saveBtn: "सहेजें",
          stopBtn: "⏹ जेनरेशन रोकें",
          imgAttached: "छवि संलग्न है",
          placeholder: "Nep AI को संदेश भेजें...",
          greetingTitle: "नमस्ते! मैं Nep AI हूँ",
          greetingSub: "आज मैं आपकी कैसे मदद कर सकता हूँ?",
          thinking: "सोच रहा है...",
          listen: "🔊 सुनें",
          stop: "⏹ रोकें",
          defaultChatTitle: "नया चैट",
          imageQuery: "छवि प्रश्न",
          sentImage: "छवि भेजी गई",
          stoppedGen: "जेनरेशन रोक दिया गया।"
        }
      };

      const mobileMenuBtn = document.getElementById('mobileMenuBtn');
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      const chatInput = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const stopBtn = document.getElementById('stopBtn');
      const chatMessages = document.getElementById('chatMessages');
      const newChatBtn = document.getElementById('newChatBtn');
      const historyList = document.getElementById('historyList');
      const attachBtn = document.getElementById('attachBtn');
      const imageInput = document.getElementById('imageInput');
      const imagePreviewContainer = document.getElementById('imagePreviewContainer');
      const selectedThumb = document.getElementById('selectedThumb');
      const removeImgBtn = document.getElementById('removeImgBtn');
      
      const settingsBtn = document.getElementById('settingsBtn');
      const headerSettingsBtn = document.getElementById('headerSettingsBtn');
      const settingsModal = document.getElementById('settingsModal');
      const closeModal = document.getElementById('closeModal');
      const saveSettingsBtn = document.getElementById('saveSettingsBtn');
      const languageSelect = document.getElementById('languageSelect');

      let currentLanguage = localStorage.getItem('nep_ai_language') || 'English';
      languageSelect.value = currentLanguage;

      function updateUITexts() {
        const t = translations[currentLanguage];
        newChatBtn.textContent = t.newChat;
        settingsBtn.textContent = "⚙️ " + t.settings;
        document.getElementById('txtHeaderSettings').textContent = t.settings;
        document.getElementById('txtHistoryHeader').textContent = t.historyHeader;
        document.getElementById('txtNoHistory').textContent = t.noHistory;
        document.getElementById('txtModalHeader').textContent = t.modalHeader;
        document.getElementById('txtModalSub').textContent = t.modalSub;
        saveSettingsBtn.textContent = t.saveBtn;
        stopBtn.innerHTML = t.stopBtn;
        document.getElementById('txtImgAttached').textContent = t.imgAttached;
        chatInput.placeholder = t.placeholder;

        const txtWelcomeTitle = document.getElementById('txtWelcomeTitle');
        const txtWelcomeSub = document.getElementById('txtWelcomeSub');
        if (txtWelcomeTitle) txtWelcomeTitle.textContent = t.greetingTitle;
        if (txtWelcomeSub) txtWelcomeSub.textContent = t.greetingSub;
      }

      updateUITexts();

      function openSettings(e) {
        if (e) e.preventDefault();
        languageSelect.value = currentLanguage;
        settingsModal.classList.add('active');
        if (window.innerWidth <= 768 && sidebar.classList.contains('open')) toggleMenu();
      }

      function closeSettings(e) {
        if (e) e.preventDefault();
        settingsModal.classList.remove('active');
      }

      settingsBtn.addEventListener('click', openSettings);
      headerSettingsBtn.addEventListener('click', openSettings);
      closeModal.addEventListener('click', closeSettings);
      
      settingsModal.addEventListener('click', (e) => { 
        if (e.target === settingsModal) {
          closeSettings();
        } 
      });
      
      saveSettingsBtn.addEventListener('click', (e) => {
        e.preventDefault();
        currentLanguage = languageSelect.value;
        localStorage.setItem('nep_ai_language', currentLanguage);
        updateUITexts();
        settingsModal.classList.remove('active');
      });

      let conversationHistory = [];
      let savedConversations = JSON.parse(localStorage.getItem('nep_ai_chat_history') || '[]');
      let currentAbortController = null;
      let attachedBase64Image = null;

      attachBtn.addEventListener('click', () => imageInput.click());
      imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(uploadEvent) {
          attachedBase64Image = uploadEvent.target.result;
          selectedThumb.src = attachedBase64Image;
          imagePreviewContainer.classList.add('active');
        };
        reader.readAsDataURL(file);
      });
      removeImgBtn.addEventListener('click', () => {
        attachedBase64Image = null;
        imageInput.value = '';
        imagePreviewContainer.classList.remove('active');
      });

      function speakText(buttonElement, text) {
        if (!('speechSynthesis' in window)) { alert("Text-to-speech not supported."); return; }
        window.speechSynthesis.cancel();
        const t = translations[currentLanguage];
        if (buttonElement.classList.contains('speaking')) { buttonElement.classList.remove('speaking'); buttonElement.innerHTML = t.listen; return; }
        document.querySelectorAll('.tts-btn').forEach(btn => { btn.classList.remove('speaking'); btn.innerHTML = translations[currentLanguage].listen; });
        const utterance = new SpeechSynthesisUtterance(text);
        buttonElement.classList.add('speaking');
        buttonElement.innerHTML = t.stop;
        utterance.onend = utterance.onerror = () => { buttonElement.classList.remove('speaking'); buttonElement.innerHTML = translations[currentLanguage].listen; };
        window.speechSynthesis.speak(utterance);
      }

      function renderHistory() {
        const t = translations[currentLanguage];
        if (savedConversations.length === 0) { historyList.innerHTML = `<div style="color: var(--text-muted); font-size: 0.8rem;">${t.noHistory}</div>`; return; }
        historyList.innerHTML = '';
        savedConversations.forEach((chat, idx) => {
          const item = document.createElement('div');
          item.className = 'history-item';
          item.textContent = chat.title;
          item.addEventListener('click', () => { loadChat(idx); if (window.innerWidth <= 768) toggleMenu(); });
          historyList.appendChild(item);
        });
      }

      function loadChat(index) {
        window.speechSynthesis.cancel();
        if (currentAbortController) currentAbortController.abort();
        stopBtn.classList.remove('active');
        const chat = savedConversations[index];
        conversationHistory = [...chat.messages];
        chatMessages.innerHTML = '';
        conversationHistory.forEach(msg => {
          let displayContent = msg.content, displayImage = null;
          if (Array.isArray(msg.content)) {
            const textPart = msg.content.find(c => c.type === 'text');
            const imgPart = msg.content.find(c => c.type === 'image_url');
            displayContent = textPart ? textPart.text : '';
            displayImage = imgPart ? imgPart.image_url.url : null;
          }
          appendMessageUI(msg.role === 'user' ? 'user' : 'assistant', displayContent, displayImage);
        });
      }

      function toggleMenu() { sidebar.classList.toggle('open'); backdrop.classList.toggle('active'); }
      mobileMenuBtn.addEventListener('click', toggleMenu);
      backdrop.addEventListener('click', toggleMenu);

      newChatBtn.addEventListener('click', () => {
        window.speechSynthesis.cancel();
        if (currentAbortController) currentAbortController.abort();
        stopBtn.classList.remove('active');
        if (conversationHistory.length > 0) saveCurrentChatToHistory();
        conversationHistory = [];
        const t = translations[currentLanguage];
        chatMessages.innerHTML = `
          <div class="welcome-hero" id="welcomeHero">
            <h1 id="txtWelcomeTitle">${t.greetingTitle}</h1>
            <p id="txtWelcomeSub">${t.greetingSub}</p>
          </div>
        `;
        if (window.innerWidth <= 768) toggleMenu();
      });

      function saveCurrentChatToHistory() {
        if (conversationHistory.length === 0) return;
        const firstUserMsg = conversationHistory.find(m => m.role === 'user');
        const t = translations[currentLanguage];
        let titleText = t.defaultChatTitle;
        if (firstUserMsg) {
          if (typeof firstUserMsg.content === 'string') titleText = firstUserMsg.content.slice(0, 30) + '...';
          else if (Array.isArray(firstUserMsg.content)) {
            const tr = firstUserMsg.content.find(c => c.type === 'text');
            titleText = tr ? tr.text.slice(0, 30) + '...' : t.imageQuery;
          }
        }
        savedConversations.unshift({ title: titleText, messages: [...conversationHistory] });
        if (savedConversations.length > 15) savedConversations.pop();
        localStorage.setItem('nep_ai_chat_history', JSON.stringify(savedConversations));
        renderHistory();
      }

      async function callGroqCloudAPI(promptText, imageUrl) {
        const t = translations[currentLanguage];
        const loadingId = 'msg-' + Date.now();
        chatMessages.innerHTML += `<div class="message-wrapper assistant" id="${loadingId}"><div class="message-bubble" style="opacity: 0.7;">${t.thinking}</div></div>`;
        chatMessages.scrollTop = chatMessages.scrollHeight;
        stopBtn.classList.add('active');
        currentAbortController = new AbortController();
        try {
          let userMessageContent = imageUrl ? [{ type: "text", text: promptText || "Analyze this image" }, { type: "image_url", image_url: { url: imageUrl } }] : promptText;
          conversationHistory.push({ role: 'user', content: userMessageContent });
          
          const systemInstruction = `You are Nep AI, a helpful, direct, and intelligent assistant. You must respond strictly in the language chosen by the user: ${currentLanguage}. Provide ONLY the direct final answer using "you" and do not include any reasoning steps, thinking blocks, or third-person notes.`;

          const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_API_KEY}` },
            body: JSON.stringify({ 
              model: 'qwen/qwen3.6-27b', 
              messages: [
                { role: 'system', content: systemInstruction }, 
                ...conversationHistory
              ], 
              max_completion_tokens: 1024,
              reasoning_format: 'hidden',
              reasoning_effort: 'none'
            }),
            signal: currentAbortController.signal
          });
          const data = await response.json();
          document.getElementById(loadingId)?.remove();
          stopBtn.classList.remove('active');
          if (data.choices && data.choices[0].message) {
            let aiReply = data.choices[0].message.content;
            if (aiReply.includes('<think>')) {
              aiReply = aiReply.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
            }
            conversationHistory.push({ role: 'assistant', content: aiReply });
            appendMessageUI('assistant', aiReply);
            saveCurrentChatToHistory();
          } else {
            appendMessageUI('assistant', 'Error: Unexpected response from API.');
          }
        } catch (error) {
          document.getElementById(loadingId)?.remove();
          stopBtn.classList.remove('active');
          if (error.name === 'AbortError') {
            appendMessageUI('assistant', `_${t.stoppedGen}_`);
            conversationHistory.push({ role: 'assistant', content: t.stoppedGen });
          } else {
            appendMessageUI('assistant', 'Network error connecting to API.');
          }
        }
      }

      stopBtn.addEventListener('click', () => currentAbortController?.abort());

      function appendMessageUI(sender, text, imageUrl = null) {
        const welcomeHero = document.getElementById('welcomeHero');
        if (welcomeHero) welcomeHero.remove();

        const t = translations[currentLanguage];
        let footerHtml = '', imageHtml = imageUrl ? `<img src="${imageUrl}" class="chat-img-preview" alt="Image" />` : '';
        let formattedContent = sender === 'user' ? `${imageHtml}<p>${(text || '').replace(/</g, "&lt;")}</p>` : marked.parse(text || '');
        if (sender !== 'user') {
          const tempDiv = document.createElement('div'); tempDiv.innerHTML = formattedContent;
          const encodedText = btoa(unescape(encodeURIComponent(tempDiv.textContent || tempDiv.innerText || '')));
          footerHtml = `<div class="msg-footer"><button class="tts-btn" onclick="speakEncodedText(this, '${encodedText}')">${t.listen}</button></div>`;
        }
        chatMessages.innerHTML += `<div class="message-wrapper ${sender}"><div class="message-bubble">${formattedContent}</div>${footerHtml}</div>`;
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function speakEncodedText(btn, b64) { speakText(btn, decodeURIComponent(escape(atob(b64)))); }

      function handleSendMessage() {
        const t = translations[currentLanguage];
        const text = chatInput.value.trim(), activeImage = attachedBase64Image;
        if (!text && !activeImage) return;
        appendMessageUI('user', text || t.sentImage, activeImage);
        chatInput.value = ''; attachedBase64Image = null; imageInput.value = ''; imagePreviewContainer.classList.remove('active');
        callGroqCloudAPI(text, activeImage);
      }

      sendBtn.addEventListener('click', handleSendMessage);
      chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMessage(); } });
      renderHistory();
    </script>
  </body>
  </html>
