<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate AI Chat Studio</title>
    <!-- Icons & Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --user-msg: rgba(56, 189, 248, 0.2);
            --bot-msg: rgba(30, 41, 59, 0.6);
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --danger: #ef4444;
            --sidebar-width: 280px;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.1);
            --text-color: #0f172a;
            --user-msg: rgba(56, 189, 248, 0.3);
            --bot-msg: rgba(255, 255, 255, 0.9);
            --accent: #0284c7;
        }

        [data-theme="neon"] {
            --bg-color: #000000;
            --glass-bg: rgba(10, 10, 10, 0.85);
            --glass-border: rgba(57, 255, 20, 0.3);
            --text-color: #39ff14;
            --user-msg: rgba(57, 255, 20, 0.15);
            --bot-msg: rgba(20, 20, 20, 0.85);
            --accent: #39ff14;
            --accent-hover: #32cc12;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            z-index: 1;
            backdrop-filter: blur(10px);
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--glass-bg);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .new-chat-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .new-chat-btn:hover { background: var(--accent-hover); }

        .history-list {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .history-item {
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
        }

        .history-item.active { background: rgba(255, 255, 255, 0.15); }

        .delete-btn { color: var(--danger); background: none; border: none; cursor: pointer; }

        .sidebar-footer { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }

        .icon-btn {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--glass-border);
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .main-chat {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 1rem;
            background: var(--glass-bg);
            border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .message.user {
            background: var(--user-msg);
            align-self: flex-end;
        }

        .message.assistant {
            background: var(--bot-msg);
            align-self: flex-start;
            border: 1px solid var(--glass-border);
        }

        .message-img-container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
            max-width: 100%;
        }

        .message img {
            max-width: 100%;
            border-radius: 8px;
            display: block;
        }

        .download-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            display: flex; align-items: center; gap: 5px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message-img-container:hover .download-btn { opacity: 1; }

        .input-area {
            padding: 1rem;
            background: var(--glass-bg);
            border-top: 1px solid var(--glass-border);
            display: flex; flex-direction: column; gap: 10px;
        }

        .image-preview {
            display: none; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.1); padding: 5px 10px; border-radius: 8px; width: max-content;
        }

        .image-preview img { height: 40px; border-radius: 4px; }
        .image-preview button { background: none; border: none; color: var(--danger); cursor: pointer; }

        .input-controls { display: flex; gap: 10px; align-items: center; }

        .chat-input {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 12px; border-radius: 8px; outline: none; resize: none; height: 50px;
        }

        .control-btn {
            width: 50px; height: 50px; border-radius: 8px; border: 1px solid var(--glass-border);
            background: var(--glass-bg); color: var(--text-color); cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }

        .control-btn.send { background: var(--accent); color: white; border: none; }

        .control-btn.voice.active { background: #ef4444; color: white; animation: pulse 1.5s infinite; }
        .control-btn.stop { display: none; background: #f59e0b; color: white; }
        .control-btn.stop.active { display: flex; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }

        .modal {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 2rem; border-radius: 12px; width: 90%; max-width: 400px;
            display: flex; flex-direction: column; gap: 15px;
        }

        .modal input, .modal textarea {
            width: 100%; padding: 10px; border-radius: 5px;
            background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border); color: var(--text-color);
        }

        .modal button { background: var(--accent); color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; }
        #file-upload { display: none; }
    </style>
</head>
<body>

    <!-- Falling Flowers Canvas Background -->
    <canvas id="bg-canvas"></canvas>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <button class="new-chat-btn" onclick="createNewChat()">
                <i class="fas fa-plus"></i> New Chat
            </button>
            <div class="history-list" id="history-list">
                <!-- Chat history items load here dynamically -->
            </div>
            <div class="sidebar-footer">
                <button class="icon-btn" onclick="toggleTheme()">
                    <i class="fas fa-palette"></i> Toggle Theme
                </button>
                <button class="icon-btn" onclick="openSettings()">
                    <i class="fas fa-cog"></i> Settings
                </button>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-chat">
            <div class="chat-header">
                <h3><i class="fas fa-robot"></i> AI Assistant</h3>
                <span id="current-model-display">grok-4</span>
            </div>

            <div class="chat-messages" id="chat-messages">
                <!-- Messages load here -->
            </div>

            <div class="input-area">
                <div class="image-preview" id="image-preview">
                    <img id="preview-img" src="" alt="Preview">
                    <span id="preview-name">image.png</span>
                    <button onclick="clearImage()"><i class="fas fa-times"></i></button>
                </div>
                
                <div class="input-controls">
                    <input type="file" id="file-upload" accept="image/*" onchange="handleFileUpload(event)">
                    <button class="control-btn" onclick="document.getElementById('file-upload').click()" title="Upload Image">
                        <i class="fas fa-image"></i>
                    </button>
                    
                    <button class="control-btn voice" id="voice-btn" onclick="toggleVoiceMode()" title="Voice Mode">
                        <i class="fas fa-microphone"></i>
                    </button>
                    
                    <button class="control-btn stop" id="stop-btn" onclick="stopAI()" title="Stop Generation">
                        <i class="fas fa-stop-circle"></i>
                    </button>

                    <textarea class="chat-input" id="chat-input" placeholder="Ask anything or say 'generate an image of...'" onkeydown="handleEnter(event)"></textarea>
                    
                    <button class="control-btn send" onclick="handleSendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2>Settings</h2>
            <label>API Key (xAI / Groq / OpenAI)</label>
            <input type="password" id="api-key" placeholder="Enter API Key...">
            
            <label>System Prompt</label>
            <textarea id="system-prompt" rows="3">You are a helpful AI assistant.</textarea>
            
            <button onclick="saveSettings()">Save & Close</button>
        </div>
    </div>
    <!-- External Libraries & Embedded App Logic -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

    <script>
    /* ==========================================
       1. FALLING FLOWERS BACKGROUND
    ========================================== */
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];

    function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height - height;
            this.size = Math.random() * 3 + 1;
            this.speedY = Math.random() * 1 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.5;
            this.opacity = Math.random() * 0.5 + 0.1;
            this.color = `rgba(56, 189, 248, ${this.opacity})`;
        }
        update() {
            this.y += this.speedY;
            this.x += this.speedX;
            if (this.y > height) {
                this.y = -10;
                this.x = Math.random() * width;
            }
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        }
    }

    for (let i = 0; i < 40; i++) particles.push(new Particle());
    function animateParticles() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* ==========================================
       2. APP STATE & LOCAL STORAGE
    ========================================== */
    let apiKey = localStorage.getItem('apiKey') || '';
    let systemPrompt = localStorage.getItem('systemPrompt') || 'You are a helpful AI assistant.';
    let currentTheme = localStorage.getItem('theme') || 'dark';

    let savedConversations = JSON.parse(localStorage.getItem('savedChats')) || [];
    let currentChatIndex = null;
    let conversationHistory = [];
    let activeImageBase64 = null;

    document.documentElement.setAttribute('data-theme', currentTheme);
    document.getElementById('api-key').value = apiKey;
    document.getElementById('system-prompt').value = systemPrompt;

    const chatMessages = document.getElementById('chat-messages');
    const historyList = document.getElementById('history-list');

    function toggleTheme() {
        const themes = ['dark', 'light', 'neon'];
        let nextIndex = (themes.indexOf(currentTheme) + 1) % themes.length;
        currentTheme = themes[nextIndex];
        document.documentElement.setAttribute('data-theme', currentTheme);
        localStorage.setItem('theme', currentTheme);
    }

    /* ==========================================
       3. CHAT HISTORY (PERSISTENT IMAGES & SESSIONS)
    ========================================== */
    function initApp() {
        if (savedConversations.length === 0) {
            createNewChat();
        } else {
            loadChat(0);
        }
    }

    function createNewChat() {
        const newChat = { id: Date.now(), title: 'New Conversation', messages: [] };
        savedConversations.unshift(newChat);
        saveToLocalStorage();
        loadChat(0);
    }

    function loadChat(index) {
        currentChatIndex = index;
        conversationHistory = [...savedConversations[index].messages];
        chatMessages.innerHTML = '';
        
        if (conversationHistory.length === 0) {
            appendMessageUI('assistant', 'Hello! How can I help you today?');
        } else {
            conversationHistory.forEach(msg => {
                appendMessageUI(msg.role === 'user' ? 'user' : 'assistant', msg.content, msg.imageUrl || null);
            });
        }
        renderHistory();
    }

    function saveCurrentChatToHistory() {
        if (currentChatIndex !== null && savedConversations[currentChatIndex]) {
            const firstUserMsg = conversationHistory.find(m => m.role === 'user');
            if (firstUserMsg && savedConversations[currentChatIndex].title === 'New Conversation') {
                savedConversations[currentChatIndex].title = firstUserMsg.content.substring(0, 25) + '...';
            }
            savedConversations[currentChatIndex].messages = [...conversationHistory];
            saveToLocalStorage();
            renderHistory();
        }
    }

    function saveToLocalStorage() {
        localStorage.setItem('savedChats', JSON.stringify(savedConversations));
    }

    function renderHistory() {
        historyList.innerHTML = '';
        savedConversations.forEach((chat, index) => {
            const div = document.createElement('div');
            div.className = `history-item ${index === currentChatIndex ? 'active' : ''}`;
            div.innerHTML = `
                <span onclick="loadChat(${index})" style="flex-grow:1; overflow:hidden; text-overflow:ellipsis;">${chat.title}</span>
                <button class="delete-btn" onclick="deleteChat(${index}, event)"><i class="fas fa-trash"></i></button>
            `;
            historyList.appendChild(div);
        });
    }

    function deleteChat(index, event) {
        event.stopPropagation();
        savedConversations.splice(index, 1);
        if (savedConversations.length === 0) createNewChat();
        else loadChat(0);
        saveToLocalStorage();
    }

    /* ==========================================
       4. UI DISPLAY & DIRECT DOWNLOADS
    ========================================== */
    function appendMessageUI(role, text, imageUrl = null) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        
        if (text) div.innerHTML = marked.parse(text);

        if (imageUrl) {
            const imgContainer = document.createElement('div');
            imgContainer.className = 'message-img-container';

            const img = document.createElement('img');
            img.src = imageUrl;
            imgContainer.appendChild(img);

            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'download-btn';
            downloadBtn.innerHTML = '<i class="fas fa-download"></i> Download';
            downloadBtn.onclick = () => downloadImage(imageUrl, `pollinations_${Date.now()}.png`);
            
            imgContainer.appendChild(downloadBtn);
            div.appendChild(imgContainer);
        }

        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function downloadImage(url, filename) {
        try {
            const response = await fetch(url);
            const blob = await response.blob();
            const objectUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = objectUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(objectUrl);
        } catch (err) {
            window.open(url, '_blank');
        }
    }

    /* ==========================================
       5. POLLINATIONS AI IMAGE GENERATION
    ========================================== */
    function isImageGenerationRequest(text) {
        const lower = text.toLowerCase();
        return lower.includes('generate an image') || lower.includes('create an image') || lower.startsWith('imagine ');
    }

    function handleImageGeneration(promptText) {
        const seed = Math.floor(Math.random() * 1000000);
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptText)}?seed=${seed}&nologo=true`;
        
        const replyText = `Here is your image for: **"${promptText}"**`;
        appendMessageUI('assistant', replyText, imageUrl);
        
        conversationHistory.push({ 
            role: 'assistant', 
            content: replyText, 
            imageUrl: imageUrl 
        });
        saveCurrentChatToHistory();
    }

    /* ==========================================
       6. SEND MESSAGE & INPUT HANDLERS
    ========================================== */
    function handleSendMessage() {
        const inputEl = document.getElementById('chat-input');
        const text = inputEl.value.trim();
        if (!text) return;

        appendMessageUI('user', text, activeImageBase64);
        
        conversationHistory.push({ 
            role: 'user', 
            content: text, 
            imageUrl: activeImageBase64 
        });
        saveCurrentChatToHistory();

        inputEl.value = '';

        if (isImageGenerationRequest(text)) {
            setTimeout(() => handleImageGeneration(text), 500);
        } else {
            setTimeout(() => {
                const aiReply = "Got it! Your memory and images are permanently saved to this chat session.";
                appendMessageUI('assistant', aiReply);
                conversationHistory.push({ role: 'assistant', content: aiReply });
                saveCurrentChatToHistory();
            }, 800);
        }

        clearImage();
    }

    function handleEnter(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSendMessage();
        }
    }

    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                activeImageBase64 = event.target.result;
                document.getElementById('preview-img').src = activeImageBase64;
                document.getElementById('image-preview').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }
    }

    function clearImage() {
        activeImageBase64 = null;
        document.getElementById('image-preview').style.display = 'none';
        document.getElementById('file-upload').value = '';
    }

    function toggleVoiceMode() {
        const btn = document.getElementById('voice-btn');
        btn.classList.toggle('active');
    }

    function stopAI() {
        console.log('Generation stopped.');
    }

    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function saveSettings() {
        localStorage.setItem('apiKey', document.getElementById('api-key').value);
        localStorage.setItem('systemPrompt', document.getElementById('system-prompt').value);
        document.getElementById('settings-modal').style.display = 'none';
    }

    initApp();
    </script>
</body>
</html>
