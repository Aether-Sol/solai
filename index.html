<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sol AI - Grok Experience</title>
    <style>
      :root {
        --bg-deep: #090610;
        --bg-surface: #130d20;
        --border-color: rgba(192, 132, 252, 0.15);
        --primary: #c084fc;
        --text-main: #f3e8ff;
        --text-muted: #a78bfa;
        --gradient-start: #e879f9;
        --gradient-end: #c084fc;
        --msg-user: linear-gradient(135deg, #7e22ce, #6b21a8);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
      
      html, body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        position: fixed;
        font-size: 15px;
      }

      .app-container {
        display: flex;
        width: 100%;
        height: 100%;
        height: 100dvh;
        position: relative;
        overflow: hidden;
      }

      .sidebar {
        width: 280px; 
        background-color: var(--bg-surface); 
        border-right: 1px solid var(--border-color);
        display: flex; 
        flex-direction: column; 
        z-index: 100; 
        transition: transform 0.3s ease-in-out; 
        flex-shrink: 0;
        height: 100%;
      }
      .sidebar-top { padding: 18px 20px; font-weight: 800; font-size: 1.5rem; color: var(--primary); display: flex; align-items: center; justify-content: space-between; }
      .sidebar-actions { padding: 0 16px 16px; }
      .btn-new-chat { background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); color: #fff; border: none; padding: 11px; border-radius: 10px; width: 100%; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
      .recent-chats-container { flex: 1; padding: 0 16px; color: var(--text-muted); font-size: 0.85rem; overflow-y: auto; }
      .sidebar-footer { padding: 14px 16px; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border-color); }

      .main-content { 
        flex: 1; 
        display: flex; 
        flex-direction: column; 
        height: 100%;
        height: 100dvh;
        position: relative; 
        overflow: hidden; 
        min-width: 0;
      }
      
      .chat-header { 
        padding: 12px 16px; 
        border-bottom: 1px solid var(--border-color); 
        background: var(--bg-surface); 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        flex-shrink: 0;
      }
      
      .mobile-menu-toggle { 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        background: var(--bg-deep); 
        border: 1px solid var(--border-color); 
        color: var(--text-main); 
        padding: 8px 12px; 
        border-radius: 10px; 
        cursor: pointer; 
        font-size: 1.1rem;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 8px;
        position: relative;
      }

      .api-key-btn {
        background: rgba(192, 132, 252, 0.1);
        border: 1px solid var(--border-color);
        color: var(--primary);
        padding: 7px 10px;
        border-radius: 9px;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
      }

      .user-avatar-badge { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem; flex-shrink: 0; }
      .user-dropdown-menu { position: absolute; top: 46px; right: 0; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 12px; width: 130px; display: none; flex-direction: column; padding: 4px; z-index: 500; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
      .user-dropdown-menu.active { display: flex; }
      .dropdown-item.logout { background: transparent; border: none; color: #ef4444; padding: 9px 12px; text-align: left; cursor: pointer; font-weight: 600; font-size: 0.85rem; border-radius: 8px; }

      .chat-messages-container { 
        flex: 1; 
        overflow-y: auto; 
        padding: 16px; 
        display: flex; 
        flex-direction: column; 
        gap: 14px; 
        -webkit-overflow-scrolling: touch;
      }
      
      .message-wrapper { display: flex; max-width: 800px; width: 100%; margin: 0 auto; }
      .message-wrapper.user { justify-content: flex-end; }
      .message-bubble { padding: 11px 15px; border-radius: 14px; font-size: 0.9rem; line-height: 1.45; word-break: break-word; }
      .message-wrapper.user .message-bubble { background: var(--msg-user); color: #fff; border-bottom-right-radius: 4px; }
      .message-wrapper.assistant .message-bubble { background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main); border-bottom-left-radius: 4px; }

      /* Optimized bottom typing wrapper to prevent keyboard layout cutoffs */
      .chat-input-wrapper {
        padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)) 12px;
        background: var(--bg-surface);
        border-top: 1px solid var(--border-color);
        flex-shrink: 0;
      }

      .chat-input-area { 
        display: flex; 
        align-items: flex-end;
        gap: 8px; 
        max-width: 900px; 
        width: 100%; 
        margin: 0 auto; 
        background: var(--bg-deep);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 6px 10px;
      }
      
      .chat-input { 
        flex: 1; 
        background: transparent; 
        border: none; 
        color: var(--text-main); 
        outline: none; 
        resize: none; 
        max-height: 90px;
        font-size: 0.9rem;
        padding: 6px 0;
        line-height: 1.3;
      }
      
      .send-btn { 
        background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); 
        border: none; 
        color: #fff; 
        width: 34px; 
        height: 34px; 
        border-radius: 9px; 
        cursor: pointer; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        flex-shrink: 0;
        margin-bottom: 2px;
      }

      /* AUTH OVERLAY */
      .auth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(9, 6, 16, 0.95); backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
      .auth-overlay.hidden { display: none !important; }
      .auth-card { background: var(--bg-surface); border: 1px solid var(--border-color); width: 380px; max-width: 100%; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
      .auth-title { font-size: 1.35rem; font-weight: 700; text-align: center; color: var(--primary); }
      .auth-field { display: flex; flex-direction: column; gap: 5px; }
      .auth-label { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
      .auth-input { background: var(--bg-deep); border: 1px solid var(--border-color); border-radius: 9px; padding: 10px; color: var(--text-main); outline: none; font-size: 0.9rem; }
      .auth-btn { background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); color: #fff; border: none; padding: 10px; border-radius: 9px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
      
      .api-link-box {
        font-size: 0.8rem;
        color: var(--text-muted);
        text-align: center;
        background: rgba(255,255,255,0.02);
        padding: 8px;
        border-radius: 8px;
        border: 1px dashed var(--border-color);
      }
      .api-link-box a {
        color: var(--primary);
        text-decoration: underline;
        font-weight: 600;
      }

      .sidebar-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 99; display: none; }
      .sidebar-backdrop.active { display: block; }

      @media (max-width: 768px) {
        .sidebar { position: fixed; height: 100%; transform: translateX(-100%); }
        .sidebar.open { transform: translateX(0); }
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <span>Sol Ai</span>
        </div>
        <div class="sidebar-actions">
          <button class="btn-new-chat" id="newChatBtn">+ New chat</button>
        </div>
        <div class="recent-chats-container">
          <div style="text-transform:uppercase; font-size:0.7rem; margin-bottom:6px;">History</div>
          <div id="historyList">No recent chats</div>
        </div>
        <div class="sidebar-footer">Copyright Aayush Dc</div>
      </aside>

      <main class="main-content">
        <header class="chat-header">
          <button class="mobile-menu-toggle" id="mobileMenuBtn">&#9776;</button>
          <div class="header-right">
            <button class="api-key-btn" id="apiKeySettingsBtn">Grok API Key</button>
            <div class="user-menu-container">
              <div class="user-avatar-badge" id="userAvatarBadge">A</div>
              <div class="user-dropdown-menu" id="userDropdown">
                <button class="dropdown-item logout" id="logoutBtn">Logout</button>
              </div>
            </div>
          </div>
        </header>

        <div class="chat-messages-container" id="chatMessages">
          <div class="message-wrapper assistant">
            <div class="message-bubble">Hello! Enter your xAI Grok API key to start chatting.</div>
          </div>
        </div>

        <div class="chat-input-wrapper">
          <div class="chat-input-area">
            <textarea class="chat-input" id="chatInput" placeholder="Message Sol Ai..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn">➤</button>
          </div>
        </div>
      </main>
    </div>

    <!-- AUTH / CONFIG OVERLAY WITH OFFICIAL WEBSITE LINK -->
    <div class="auth-overlay" id="authOverlay">
      <div class="auth-card">
        <div class="auth-title" id="overlayTitle">Welcome to Sol Ai</div>
        <div id="overlayDesc" style="font-size: 0.82rem; color: var(--text-muted); text-align: center;">Enter your xAI Grok API key to connect.</div>
        
        <div class="api-link-box">
          Don't have a key? Get one from the official website:<br>
          <a href="https://console.x.ai/" target="_blank" rel="noopener noreferrer">console.x.ai</a>
        </div>

        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div class="auth-field">
            <label class="auth-label">Grok API Key (xAI)</label>
            <input type="password" class="auth-input" id="apiKeyInput" placeholder="xai-..." />
          </div>
          <button type="button" class="auth-btn" id="saveKeyBtn">Start Chatting</button>
        </div>
      </div>
    </div>

    <script>
      const authOverlay = document.getElementById('authOverlay');
      const apiKeyInput = document.getElementById('apiKeyInput');
      const saveKeyBtn = document.getElementById('saveKeyBtn');
      const apiKeySettingsBtn = document.getElementById('apiKeySettingsBtn');
      
      const logoutBtn = document.getElementById('logoutBtn');
      const userAvatarBadge = document.getElementById('userAvatarBadge');
      const userDropdown = document.getElementById('userDropdown');
      
      const mobileMenuBtn = document.getElementById('mobileMenuBtn');
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');

      const chatInput = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const chatMessages = document.getElementById('chatMessages');
      const newChatBtn = document.getElementById('newChatBtn');

      let grokApiKey = localStorage.getItem('sol_grok_api_key') || '';

      if (grokApiKey) {
        authOverlay.classList.add('hidden');
      }

      saveKeyBtn.addEventListener('click', () => {
        const key = apiKeyInput.value.trim();
        if (!key) {
          alert('Please enter a valid Grok API key.');
          return;
        }
        grokApiKey = key;
        localStorage.setItem('sol_grok_api_key', key);
        authOverlay.classList.add('hidden');
      });

      apiKeySettingsBtn.addEventListener('click', () => {
        apiKeyInput.value = grokApiKey;
        document.getElementById('overlayTitle').textContent = "API Configuration";
        authOverlay.classList.remove('hidden');
      });

      logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('sol_grok_api_key');
        grokApiKey = '';
        apiKeyInput.value = '';
        document.getElementById('overlayTitle').textContent = "Welcome to Sol Ai";
        authOverlay.classList.remove('hidden');
        userDropdown.classList.remove('active');
      });

      userAvatarBadge.addEventListener('click', (e) => {
        e.stopPropagation();
        userDropdown.classList.toggle('active');
      });
      document.addEventListener('click', () => userDropdown.classList.remove('active'));

      function toggleMenu() {
        sidebar.classList.toggle('open');
        backdrop.classList.toggle('active');
      }
      mobileMenuBtn.addEventListener('click', toggleMenu);
      backdrop.addEventListener('click', toggleMenu);

      newChatBtn.addEventListener('click', () => {
        chatMessages.innerHTML = `
          <div class="message-wrapper assistant">
            <div class="message-bubble">New chat started. How can I help you?</div>
          </div>
        `;
        if (window.innerWidth <= 768) toggleMenu();
      });

      async function callGrokAPI(promptText) {
        const loadingId = 'msg-' + Date.now();
        chatMessages.innerHTML += `
          <div class="message-wrapper assistant" id="${loadingId}">
            <div class="message-bubble" style="opacity: 0.7;">Thinking...</div>
          </div>
        `;
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
          const response = await fetch('https://api.x.ai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${grokApiKey}`
            },
            body: JSON.stringify({
              model: 'grok-beta',
              messages: [
                { role: 'system', content: 'You are Sol Ai, a helpful assistant.' },
                { role: 'user', content: promptText }
              ]
            })
          });

          const data = await response.json();
          const loadingElement = document.getElementById(loadingId);
          if (loadingElement) loadingElement.remove();

          if (data.choices && data.choices[0].message && data.choices[0].message.content) {
            const aiReply = data.choices[0].message.content;
            appendMessage('assistant', aiReply);
          } else if (data.error) {
            appendMessage('assistant', `API Error: ${data.error.message || 'Check your Grok API Key.'}`);
          } else {
            appendMessage('assistant', 'Error: Invalid response structure from Grok API.');
          }
        } catch (error) {
          const loadingElement = document.getElementById(loadingId);
          if (loadingElement) loadingElement.remove();
          appendMessage('assistant', 'Network error connecting to Grok API.');
        }
      }

      function appendMessage(sender, text) {
        chatMessages.innerHTML += `
          <div class="message-wrapper ${sender}">
            <div class="message-bubble">${text.replace(/\n/g, '<br>')}</div>
          </div>
        `;
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function handleSendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        if (!grokApiKey) {
          alert('Please set your Grok API key first.');
          authOverlay.classList.remove('hidden');
          return;
        }

        appendMessage('user', text);
        chatInput.value = '';
        chatInput.style.height = 'auto';

        callGrokAPI(text);
      }

      sendBtn.addEventListener('click', handleSendMessage);
      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage();
        }
      });
    </script>
  </body>
</html>
